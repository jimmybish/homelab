---
# Bootstrap the dedicated virtuajimmy agent user, SSH key and sudo on all
# managed Ubuntu/Debian hosts. For a NEW host, run this while ansible_user still
# points at a pre-existing account with SSH access (the original build user),
# BEFORE that host relies on virtuajimmy for the connection.
#
#   ansible-playbook -i inventory.yaml deploy_agent_user.yaml \
#     --tags agent_user --vault-password-file ~/ansible_key
#
# Only the agent_user-tagged tasks in os_configure run (user, key, sudo);
# the rest of the OS hardening is skipped. Omit --tags to run full os_configure.
#
# Prerequisite (one-time, on the control node):
#   ssh-keygen -t ed25519 -f ~/.ssh/virtuajimmy -C virtuajimmy
- name: Provision virtuajimmy agent user
  hosts: ubuntu:debian
  become: true
  roles:
    - os_configure
