---
- name: Silence Grafana alerts for full deployment
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Mark master silence active
      ansible.builtin.set_fact:
        grafana_master_silence_active: true

    - name: Create Grafana silence
      ansible.builtin.include_tasks: tasks/grafana_create_silence.yaml
      vars:
        grafana_silence_comment: "Master playbook full deployment"

- name: Initial OS Configuration
  ansible.builtin.import_playbook: os_setup.yaml

- name: Configure Proxmox Hosts
  ansible.builtin.import_playbook: deploy_proxmox.yaml

- name: Deploy Proxy
  ansible.builtin.import_playbook: deploy_proxy.yaml

- name: Deploy Homepage
  ansible.builtin.import_playbook: deploy_homepage.yaml

- name: Configure vLLM firewall
  ansible.builtin.import_playbook: deploy_vllm.yaml

- name: Deploy ComfyUI
  ansible.builtin.import_playbook: deploy_comfyui.yaml

- name: Deploy wg-easy
  ansible.builtin.import_playbook: deploy_wg_easy.yaml

- name: Deploy Omada SDN Controller
  ansible.builtin.import_playbook: deploy_omada_sdn.yaml

- name: Deploy Bambuddy
  ansible.builtin.import_playbook: deploy_bambuddy.yaml

- name: Deploy SearXNG
  ansible.builtin.import_playbook: deploy_searxng.yaml

- name: Deploy Firecrawl
  ansible.builtin.import_playbook: deploy_firecrawl.yaml

- name: Deploy Hermes Agent
  ansible.builtin.import_playbook: deploy_hermes.yaml

- name: Deploy Open WebUI
  ansible.builtin.import_playbook: deploy_open_webui.yaml

- name: Deploy Maintainerr
  ansible.builtin.import_playbook: deploy_maintainerr.yaml

- name: Deploy Arr Suite
  ansible.builtin.import_playbook: deploy_arr.yaml

- name: Deploy Plex
  ansible.builtin.import_playbook: deploy_plex.yaml

# - name: Deploy Jellyfin
#   ansible.builtin.import_playbook: deploy_jellyfin.yaml

- name: Deploy Jellyseerr
  ansible.builtin.import_playbook: deploy_jellyseerr.yaml

- name: Deploy Grafana
  ansible.builtin.import_playbook: deploy_grafana.yaml

- name: Deploy n8n
  ansible.builtin.import_playbook: deploy_n8n.yaml

- name: Deploy Paperless
  ansible.builtin.import_playbook: deploy_paperless.yaml

- name: Deploy Guacamole
  ansible.builtin.import_playbook: deploy_guacamole.yaml

- name: Deploy Tronbyt
  ansible.builtin.import_playbook: deploy_tronbyt.yaml

- name: Deploy Tronbyt vLLM Thinking Indicator
  ansible.builtin.import_playbook: deploy_tronbyt_vllm_thinking.yaml

- name: Deploy Tracearr
  ansible.builtin.import_playbook: deploy_tracearr.yaml

- name: Deploy MCP Tracearr
  ansible.builtin.import_playbook: deploy_mcp_tracearr.yaml

- name: Deploy MCP Sonarr
  ansible.builtin.import_playbook: deploy_mcp_sonarr.yaml

- name: Deploy MCP Radarr
  ansible.builtin.import_playbook: deploy_mcp_radarr.yaml

- name: Re-enable Grafana alerts after deployment
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove Grafana silence
      ansible.builtin.include_tasks: tasks/grafana_remove_silence.yaml

    - name: Clear master silence flag
      ansible.builtin.set_fact:
        grafana_master_silence_active: false
