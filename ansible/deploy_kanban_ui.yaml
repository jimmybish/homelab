---
- name: Collect proxy host facts for the upstream firewall rule
  # The published kanban-ui port is UFW-restricted to the SWAG proxy's
  # address, resolved in the role via hostvars[groups['proxy_host'][0]].
  # Those facts only exist if gathered; the master playbook's earlier proxy
  # play covers that, but a STANDALONE run of this playbook must gather them
  # too or the set_fact blows up undefined (same pattern as
  # deploy_tronbyt_vllm_thinking.yaml's Grafana-facts play).
  hosts: proxy_host
  gather_facts: true
  become: false

- name: Install Kanban UI
  hosts: hermes_host
  become: true
  pre_tasks:
    - name: Ensure proxy host facts are available for the upstream firewall rule
      # ROUND-5 FINDING 4323914956: the facts play above is `hosts:
      # proxy_host`, so a HOST-LIMITED run (--limit hermes) or a TAGGED run
      # (--tags kanban_ui_firewall) never executes it, and the role's
      # `hostvars[groups['proxy_host'][0]]['ansible_default_ipv4']` resolution
      # (tasks/main.yaml, UFW source pin + DOCKER-USER enforcement) explodes
      # undefined (reproduced: "'HostVarsVars object' has no attribute
      # 'ansible_default_ipv4'"). Gather them HERE instead via a delegated
      # setup; delegate_facts attaches them to the DELEGATED host (proxy),
      # which is exactly where the role reads them. become:false since fact
      # gathering needs no privilege and the proxy play above runs
      # unprivileged too. The when-guard keeps this free on the unbounded
      # path: the facts play (or the master playbook's earlier proxy play)
      # already populated hostvars['proxy'], so the delegated setup only
      # costs ~1-2s on the limited/tagged paths Copilot flagged. Tagged
      # `always` so it survives any --tags selection, including the
      # firewall-only teardown run.
      ansible.builtin.setup:
      delegate_to: "{{ groups['proxy_host'][0] }}"
      delegate_facts: true
      become: false
      when: >-
        hostvars[groups['proxy_host'][0]]['ansible_default_ipv4'] is not defined
      tags:
        - always

    - name: Silence Grafana alerts
      ansible.builtin.include_tasks: tasks/grafana_create_silence.yaml
      vars:
        grafana_silence_comment: "Deploying Kanban UI"
      when: >-
        not
        (hostvars['localhost']['grafana_master_silence_active']
         | default(false))
  roles:
    - kanban_ui
  post_tasks:
    - name: Remove Grafana alert silence
      ansible.builtin.include_tasks: tasks/grafana_remove_silence.yaml
      when: >-
        not
        (hostvars['localhost']['grafana_master_silence_active']
         | default(false))
