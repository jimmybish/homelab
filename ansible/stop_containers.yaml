---
# hosts is `localhost, all` so ANY --limit value still matches both this
# Initialise play and the remove play at the bottom (a narrower pattern is
# dropped when the limit selects a host outside it, which skipped the
# prompt/add_host and the silence during limited runs).
# No play-level become: every task here is add_host/set_fact (runs on the
# controller) or delegates to localhost with become: false, so limited runs
# against a host without Ansible sudo cannot fail on privilege escalation
# before the silence is even created.
- name: Initialise
  hosts: localhost, all
  gather_facts: false
  vars_prompt:
    - name: target_hosts
      prompt: Please enter a comma-separated list of hosts or a host group
      private: false

  tasks:
    - name: Check if target_hosts is a host group
      ansible.builtin.set_fact:
        is_host_group: "{{ target_hosts in groups }}"

    - name: Add hosts from group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: hosts_list
      when: is_host_group
      with_items: "{{ groups[target_hosts] }}"

    - name: Add individual hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: hosts_list
      when: not is_host_group
      with_items: "{{ target_hosts.split(',') }}"

    - name: Silence Grafana alerts before stopping containers
      ansible.builtin.include_tasks: tasks/grafana_create_silence.yaml
      vars:
        grafana_silence_comment: "Stopping containers — {{ target_hosts }}"
      run_once: true

- name: Stop containers
  hosts: hosts_list
  become: true
  tasks:
    - name: Preflight unprivileged Docker access and get containers
      become: false
      community.docker.docker_host_info:
        containers: true
      register: docker_info

    - name: Show running containers
      ansible.builtin.debug:
        var: docker_info.containers

    - name: Stop running containers
      become: false
      community.docker.docker_container:
        name: "{{ item }}"
        state: stopped
      loop: "{{ docker_info.containers | map(attribute='Id') | list }}"

    - name: Verify containers
      become: false
      community.docker.docker_host_info:
        containers: true
      register: docker_info

    - name: Show running containers again
      ansible.builtin.debug:
        var: docker_info.containers

- name: Re-enable Grafana alerts
  hosts: localhost, all
  gather_facts: false
  tasks:
    - name: Remove Grafana silence
      ansible.builtin.include_tasks: tasks/grafana_remove_silence.yaml
      run_once: true
