---
# Registry-only updates. Local image upgrades belong to deployment roles.

# hosts is `localhost, all` so ANY --limit value still matches this play
# (a narrower pattern is dropped when the limit selects a host outside it).
- name: Silence Grafana alerts during container updates
  hosts: localhost, all
  gather_facts: false
  tasks:
    - name: Create Grafana silence
      ansible.builtin.include_tasks: tasks/grafana_create_silence.yaml
      vars:
        grafana_silence_comment: "Updating all Docker containers"
      run_once: true
      when: not ansible_check_mode

- name: Update all Docker Compose containers
  hosts:
    - ubuntu
  become: true
  tasks:
    - name: Initialize sanitized updater results
      ansible.builtin.set_fact:
        docker_update_results: []

    - name: Process managed projects without preventing Grafana cleanup
      block:
        - name: Discover managed Compose projects
          ansible.builtin.include_tasks: tasks/discover_managed_compose.yaml

        - name: Show exact managed Compose projects
          ansible.builtin.debug:
            var: valid_compose_projects

        # Never globally prune stopped containers: standalone exporters and
        # intentionally stopped workloads are not recreated by Compose.
        - name: Update each managed Compose project
          ansible.builtin.include_tasks: tasks/update_compose_project.yaml
          loop: "{{ valid_compose_projects }}"
          loop_control:
            loop_var: compose_project
      rescue:
        - name: Record discovery or orchestration failure without raw output
          ansible.builtin.set_fact:
            docker_update_results: >-
              {{ docker_update_results + [{
                'project': docker_storage_folder, 'status': 'failed',
                'check_mode': ansible_check_mode,
                'error': 'discovery_or_orchestration_failed'
              }] }}

- name: Re-enable Grafana alerts after container updates
  hosts: localhost, all
  gather_facts: false
  tasks:
    - name: Remove Grafana silence
      ansible.builtin.include_tasks: tasks/grafana_remove_silence.yaml
      run_once: true
      when: not ansible_check_mode

- name: Report registry updates after Grafana cleanup
  hosts: ubuntu
  gather_facts: false
  tasks:
    - name: Show sanitized updater summary
      ansible.builtin.debug:
        var: docker_update_results

    - name: Fail when any project failed
      ansible.builtin.assert:
        that:
          - docker_update_results | selectattr('status', 'equalto', 'failed') | list | length == 0
        fail_msg: "Docker updater failed; see sanitized project/stage results above. Grafana cleanup was attempted."
