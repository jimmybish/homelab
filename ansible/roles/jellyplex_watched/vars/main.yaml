# Version information
# Pinned per fleet convention (no floating 'latest').
# 9.0.0 (2026-11-04) is the pydantic-settings config rewrite; it is the
# release whose new per-server user_mappings YAML format we now use.
# Registry digest at pin time: sha256:f7174e8a53fb5782a81e5cddf4ede5406eed7577c171406cab3de73bffb2c6c7
# ROLLBACK: set to "8.5.3" (last release before the v9 settings rewrite,
# still accepts the legacy USER_MAPPING env var, digest
# sha256:e23a0d3dc686e4bbc9eeb655aeb96a2a1352bd2a26297ec77e06ef6f8eb2d5e1)
# and re-enable USER_MAPPING in templates/env.j2 (the legacy vaulted
# variable jellyplex_watched_user_mapping below is kept for that purpose).
jellyplex_watched_version: "9.0.0"

# Dry-run gate rendered into .env DRYRUN (templates/env.j2). Safe default:
# true, so a fresh or restarted deployment only logs the marks it would make
# and cannot write play state until the migrated v9 user mappings have been
# previewed by a human. This default is part of the reviewed staged tree and
# stays true through this delivery; nothing in the reviewed set is flipped
# after review PASS.
# Two-stage live verification (owned by the root delivery card after review
# PASS, run from this worktree's ansible/ dir):
#   1. Deploy with the default (dry-run ON):
#        ansible-playbook -i inventory.yaml deploy_jellyplex_watched.yaml \
#          --vault-password-file ~/ansible_key
#      Inspect the planned mappings/sync: docker logs jellyplex-watched, plus
#      LOG_FILE/MARK_FILE under {{ jellyplex_watched_folder }}.
#   2. When the preview is clean, redeploy writes-enabled for the live
#      verification WITHOUT editing this file:
#        ansible-playbook -i inventory.yaml deploy_jellyplex_watched.yaml \
#          --vault-password-file ~/ansible_key -e jellyplex_watched_dryrun=false
#   3. If a persistent writes-enabled default is wanted later (so routine
#      master_playbook runs do not revert the service to preview mode), it is
#      a separately staged and separately reviewed finalization change filed
#      after the dry-run/live evidence exists, never a post-PASS edit of this
#      reviewed tree.
jellyplex_watched_dryrun: true

# Volume paths (use docker_storage_folder from group_vars)
jellyplex_watched_folder: "{{ docker_storage_folder }}/jellyplex-watched"

# Feature flags - No web interface, runs as a background sync service
jellyplex_watched_configure_homepage: false
jellyplex_watched_configure_proxy: false
jellyplex_watched_configure_dns: false

