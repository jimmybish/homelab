---
- name: Ensure docker-compose is installed
  ansible.builtin.package:
    name: docker-compose
    state: present

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Get fileserver IP
  ansible.builtin.set_fact:
    immich_fileserver_ip: "{{ (lookup('ansible.builtin.inventory_hostnames', 'qnap').split(','))[0] }}"

# Immich's env-var reference defines IMMICH_TRUSTED_PROXIES as a
# comma-separated list of IP addresses, so resolve the reverse-proxy host to
# its runtime address at deploy time instead of passing the inventory alias.
- name: Gather reverse proxy host facts
  ansible.builtin.setup:
  delegate_to: "{{ groups['proxy_host'][0] }}"
  delegate_facts: true

- name: Derive trusted proxy IP from proxy host facts
  ansible.builtin.set_fact:
    immich_trusted_proxies: "{{ hostvars[groups['proxy_host'][0]]['ansible_default_ipv4']['address'] }}"

# Offline/render guard: prove the derived value is an IPv4 address or
# IPv4 CIDR, never an inventory alias. Dependency-free regex match (netaddr
# is not installed on the control node, so ansible.utils.ipaddr is unusable
# here). The value itself is not echoed on success.
- name: Assert trusted proxies is an IP/CIDR
  ansible.builtin.assert:
    that:
      - immich_trusted_proxies is match(
          '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}(/(3[0-2]|[12][0-9]|[1-9]))?$'
        )
      - immich_trusted_proxies != (groups['proxy_host'][0] | default(''))
    fail_msg: "immich_trusted_proxies did not resolve to a valid IPv4/CIDR (value withheld)."
    success_msg: "immich_trusted_proxies resolved to a valid IPv4/CIDR."

# The host-side NFS mount below needs /sbin/mount.nfs, which ships in
# Ubuntu's nfs-common package. No shared OS/Docker role in this host's
# deploy path installs it (verified: zero nfs references in roles/docker
# and roles/os_configure), so the immich role owns the dependency. Without
# it the ansible.posix.mount task dies with "mount.nfs: not found" even
# when the NAS export permits access, and the mount task's ignore_errors
# would let the deploy finish with a silently empty external library.
# Installed unconditionally before any mount-point/mount work so a freshly
# provisioned target converges the same as the current one (idempotent:
# apt reports ok when the package is already present).
- name: Ensure nfs-common is installed for the NFS external library mount
  ansible.builtin.package:
    name: nfs-common
    state: present

# 2. Directory Setup
# UPLOAD_LOCATION (/data), DB data and model-cache are all LOCAL bind mounts
# under the parent folder: NFS-backed Postgres is unsupported by Immich, and
# the QNAP /Photos export rejects writes from this host (run-761 evidence),
# so the writable library must live on local disk. The NAS photo share is
# only ever mounted read-only host-side for the external library feature.
# The rendered docker-compose.yaml embeds the vaulted DB password, so neither
# the parent directory nor the file may be world-readable. House pattern (per
# the firecrawl/tronbyt_vllm_thinking precedent): parent 0750 root:<docker
# group> and compose 0640 root:<docker group>. The deploy ssh account on the
# target host is a member of that group and docker compose runs without
# become, so group-readable is the required reader model.
- name: Setup Immich parent directory
  ansible.builtin.file:
    path: "{{ immich_parent_folder }}"
    state: directory
    mode: '0750'
    owner: root
    group: "{{ docker_user }}"

# PGDATA is enforced to the steady state of the pinned immich Postgres image,
# verified by inspecting the image at this commit (sha256-pinned
# ghcr.io/immich-app/postgres:14-vectorchord0.4.3): /etc/passwd defines
# postgres as uid/gid 999 and the official docker-entrypoint.sh chowns PGDATA
# to postgres and chmods it 00700. PostgreSQL refuses to run on a group- or
# world-readable data directory, so the previous 1000:1000/0755 enforcement
# fought the entrypoint on every container start. Managing the exact runtime
# ownership/mode keeps this task converged (no later run flips PGDATA).
- name: Setup Immich database directory
  ansible.builtin.file:
    path: "{{ immich_database_folder }}"
    state: directory
    mode: '0700'
    owner: "999"
    group: "999"

- name: Setup Immich model-cache directory
  ansible.builtin.file:
    path: "{{ immich_model_cache_folder }}"
    state: directory
    mode: '0755'
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"

- name: Setup Immich library directory
  # Local UPLOAD_LOCATION (uploads, thumbs, encoded-video, profile). The
  # server container runs as root (no user: mapping in compose), so this
  # matches the parent-dir house pattern and root creates the subdirs.
  ansible.builtin.file:
    path: "{{ immich_library_folder }}"
    state: directory
    mode: '0750'
    owner: root
    group: "{{ docker_user }}"

# Detect whether the mount point is an active mount before enforcing
# ownership/mode on it (run-788 evidence: once the NAS adds this host to
# the ro /Photos export, the fstab-persisted mount from a prior deploy is
# live at this path, so it is the read-only NFS root and the file module's
# chgrp/chmod dies with EROFS before the mount task below ever runs).
# `stat -c %m` was tried and rejected: on the live NFS root it dies with
# EACCES under root_squash (round-12 live probe on the target host: "cannot
# change to directory ... Permission denied"). findmnt -T resolves the
# deepest mount containing the path purely from mountinfo (verified live:
# rc=0 and TARGET = the folder path for the live ro nfs export mount)
# without touching the directory, so it works on the ro export itself.
# Existence is checked first so a fresh deploy (path absent) skips the probe
# and falls through to the file task exactly as before. Truthful detection,
# no ignore_errors, no failed_when.
- name: Check whether external library path exists
  ansible.builtin.stat:
    path: "{{ immich_external_library_folder }}"
  register: immich_external_path_stat

- name: Check whether external library path is an active mountpoint
  ansible.builtin.command:
    cmd: findmnt -rn -o TARGET -T {{ immich_external_library_folder | quote }}
  register: immich_external_mountpoint_stat
  changed_when: false
  check_mode: false
  when: immich_external_path_stat.stat.exists

- name: Derive external library mountpoint status
  # Single source of truth for the skip decision and the report below.
  # findmnt -T returns the deepest mount containing the path; equality with
  # the (absolute, templated) folder path means the folder itself is the
  # mount point. When the path is absent the probe is skipped, stdout is
  # undefined, default('') never equals the absolute folder path, and the
  # result is false => the file task enforces as today. If some unrelated
  # mount merely contains the folder, TARGET differs from it and the file
  # task still enforces on the plain directory.
  ansible.builtin.set_fact:
    immich_external_path_is_mountpoint: >-
      {{ (immich_external_mountpoint_stat.stdout | default('') | trim)
         == (immich_external_library_folder | trim) }}

- name: Report external library path mount status
  ansible.builtin.debug:
    msg: >-
      External library path {{ immich_external_library_folder }} is
      {{ 'not present; it will be created and owned root:docker group.'
      if not immich_external_path_stat.stat.exists
      else ('an active mountpoint (live read-only NFS export); ownership
      and mode are properties of the exported filesystem, so local
      enforcement is skipped.'
      if immich_external_path_is_mountpoint | bool
      else 'a plain directory; local ownership/mode will be enforced.') }}

- name: Setup Immich external library mount point
  # Host-side mount point for the read-only NAS photo share, bind-mounted
  # into the server container at /photos-external:ro. Skipped when the path
  # is already an active mount (see the probe tasks above): the ro NFS root
  # cannot be chowned/chmodded (EROFS) and its ownership is a property of
  # the export, not something this play may manage.
  ansible.builtin.file:
    path: "{{ immich_external_library_folder }}"
    state: directory
    mode: '0750'
    owner: root
    group: "{{ docker_user }}"
  when: not (immich_external_path_is_mountpoint | default(false) | bool)

- name: Mount NAS photo share read-only for the external library
  # Host-side NFS mount + bind instead of a docker nfs volume: docker mounts
  # nfs volumes at container-create time, so a rejected export (the NAS
  # /Photos export currently whitelists only the media-stack host) would
  # fail immich_server startup. With a bind mount, a failed NFS mount leaves
  # an empty read-only directory and the server still comes up healthy on
  # local /data alone. soft (not hard) matches the fleet's read-only share
  # precedent and keeps external-library scans from hanging if the NAS goes
  # down; no writes ever traverse this mount, so soft-mode EIO cannot
  # corrupt data. _netdev/nofail keep boot clean while the export is
  # missing. ignore_errors (NOT failed_when: false) is deliberate: the
  # export is expected to be rejected until the NAS owner adds this host
  # to the read-only /Photos export, and failed_when: false would overwrite
  # result['failed'] (task_executor _evaluate_failed_when_result sets
  # result['failed'] = result['failed_when_result']), making every
  # downstream status test lie. ignore_errors keeps the real failed status
  # while letting the play continue. notify is provably safe here: the
  # linear strategy queues notifications only on the non-failed branch and
  # only when the result is changed (plugins/strategy/__init__.py: the
  # '_ansible_notify' handling sits in the else of `if task_result
  # .is_failed():` and is gated by `task_result.is_changed()`), so a
  # rejected export never queues the restart and an idempotent already-
  # mounted run never queues it either. Only a genuine absent->mounted
  # transition does, which the rprivate /photos-external bind requires
  # (see the compose template header).
  ansible.posix.mount:
    src: "{{ immich_fileserver_ip }}:{{ fs_photos }}"
    path: "{{ immich_external_library_folder }}"
    fstype: nfs
    opts: "ro,soft,nolock,vers=3,_netdev,nofail"
    state: mounted
    boot: true
  register: immich_external_mount
  ignore_errors: true
  notify:
    - Restart Immich

- name: Report external library mount outcome
  ansible.builtin.debug:
    msg: >-
      External library mount at {{ immich_external_library_folder }}:
      {{ 'mounted read-only.' if (immich_external_mount is succeeded
         and not immich_external_mount is changed)
         else ('newly mounted read-only; the server will be recreated so the
         rprivate /photos-external bind sees the share.'
         if (immich_external_mount is succeeded and immich_external_mount is changed)
         else ('FAILED: ' ~ (immich_external_mount.msg | default('no message'))
         ~ ' (expected until the NAS owner adds this host to the read-only
         /Photos export). Immich external-library scanning is deferred; the
         server runs healthy on local /data alone.')) }}

- name: Record genuine external mount transition
  # Explicit fact for the flush below (reviewer finding 1): the handler must
  # fire only on a genuinely successful AND changed mount. Both halves are
  # enforced twice over - by strategy notification gating (see mount task
  # comment) and by this fact, which is what actually enables the flush.
  ansible.builtin.set_fact:
    immich_external_mount_ready: >-
      {{ immich_external_mount is not failed
         and immich_external_mount is changed }}

- name: Allow Immich port through UFW
  community.general.ufw:
    rule: allow
    port: "{{ immich_port }}"
    proto: tcp
  when: ansible_os_family == "Debian"

# 3. Deploy Configuration Files & Run Compose
- name: Deploy Immich using Docker Compose
  ansible.builtin.template:
    src: "templates/docker_compose.yaml.j2"
    dest: "{{ immich_parent_folder }}/docker-compose.yaml"
    mode: '0640'
    owner: root
    group: "{{ docker_user }}"
    force: true
  no_log: true
  # diff is a TASK-level keyword, not a template module argument
  # (ansible.builtin.template has no diff param; nesting it inside the
  # module args fails the live run with "Unsupported parameters"). Matches
  # the kanban_ui compose-template task pattern.
  diff: false
  notify:
    - Restart Immich

- name: Run Immich docker-compose up
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ immich_parent_folder }}"
    state: present
    remove_orphans: true

- name: Flush handlers after external mount transition
  # rprivate bind propagation means a container created while the mount was
  # absent keeps an empty /photos-external forever; only recreating the
  # container re-establishes the bind over the live share. This flush is
  # deliberately placed AFTER the compose template render and the compose-up
  # task above: the queued Restart Immich handler runs docker_compose_v2
  # state:restarted, which requires docker-compose.yaml to exist and the
  # project to be up, so draining the queue any earlier (before the template
  # task) would abort a fresh deployment whose NAS export was already
  # reachable. Semantics: fresh deploy with a reachable export -> compose-up
  # starts the containers, this flush recreates the server so the
  # /photos-external bind sees the share (one extra recreate on first run,
  # acceptable); mount failed (export missing, current live state) -> the
  # strategy queued nothing and the fact is false, so the flush is skipped;
  # idempotent rerun -> no changes, flush skipped, and any compose-template
  # notification drains at normal play end as before.
  ansible.builtin.meta: flush_handlers
  when: immich_external_mount_ready | default(false) | bool

# Boot-race detection (PR #27 review comment 4507729531): dockerd restores
# immich_server (restart: unless-stopped) at daemon start, which can beat the
# fstab NFS mount (_netdev,nofail). The rprivate bind then keeps the empty
# host directory for the container's whole life even after the host mount
# lands, and every later deploy sees an unchanged host mount plus unchanged
# compose config, so nothing ever recreates the container to re-establish the
# bind. Compare host and container views by mount device number (maj:min):
# the bind is live only when the container's /photos-external mountinfo entry
# carries the same device as the host mount point. Device number, not entry
# count, is required here: the NAS export root_squashes this host, so
# readdir is EACCES even for root on BOTH views (verified live on the
# immich host) and a file listing cannot tell an empty stale bind from a
# live unreadable share.
- name: Probe host device of external library mount point
  ansible.builtin.command:
    cmd: findmnt -rn -o MAJ:MIN -T {{ immich_external_library_folder | quote }}
  register: immich_host_mount_dev_probe
  changed_when: false
  check_mode: false
  ignore_errors: true

- name: Probe host target of external library mount point
  # Fresh TARGET read after the mount task above: the earlier
  # immich_external_mountpoint_stat fact predates this run's mount, so a
  # mount that succeeded during THIS play would otherwise read as absent.
  # Equality with the folder path (not mere -T success) means the folder
  # itself is the mount point, same semantics as the round-12 probe.
  ansible.builtin.command:
    cmd: findmnt -rn -o TARGET -T {{ immich_external_library_folder | quote }}
  register: immich_host_mount_target_probe
  changed_when: false
  check_mode: false
  ignore_errors: true

- name: Derive host external library mount view
  # Truthful status via 'is not failed' on ignore_errors results (same
  # rationale as the mount task above: failed_when: false would overwrite
  # result['failed']). The maj:min shape check keeps the value that gets
  # interpolated into the container-side regex below constrained to digits
  # and a colon.
  ansible.builtin.set_fact:
    immich_host_mount_active: >-
      {{ immich_host_mount_target_probe is not failed
         and (immich_host_mount_target_probe.stdout | default('') | trim)
            == (immich_external_library_folder | trim)
         and immich_host_mount_dev_probe is not failed
         and (immich_host_mount_dev_probe.stdout | default('') | trim)
            is match('^[0-9]+:[0-9]+$') }}
    immich_host_mount_dev: "{{ immich_host_mount_dev_probe.stdout | default('') | trim }}"

- name: Probe container view of the external library bind
  # Reads the container's own /proc/self/mountinfo (a /proc read of the
  # container's mount namespace, never a readdir of the squashed share, and
  # cat is in the base image so no grep dependency). rc 0 = the exec ran
  # inside a running container, so its mountinfo is authoritative. Any
  # non-zero rc (container stopped/restarting: docker CLI rc 1 with 'Error
  # ...' on stderr; exec failure: rc 125/126) is UNKNOWN and must never
  # block or churn the stack.
  become: false
  ansible.builtin.command:
    cmd: docker exec immich_server cat /proc/self/mountinfo
  register: immich_container_bind_probe
  changed_when: false
  check_mode: false
  ignore_errors: true
  when: immich_host_mount_active | bool

- name: Build external library bind mountinfo pattern
  # Built in its OWN task (round-14 review finding): a set_fact value is not
  # readable by sibling keys of the same set_fact invocation, so deriving
  # seen/stale alongside the pattern here would abort every deploy with
  # 'immich_ext_bind_mountinfo_re is undefined'.
  #
  # A live bind shows up in the container's mountinfo as a line whose third
  # field (major:minor) equals the host share's device, rooted at any path,
  # mounted at exactly /photos-external (trailing space anchors the
  # mount-point field so a hypothetical /photos-external-2 prefix can never
  # false-match). The device value interpolated into the pattern was
  # shape-validated above to [0-9]+:[0-9]+, so no regex metacharacters can
  # leak in. When the host mount is inactive the value is empty and the
  # pattern simply never matches anything; every consumer is gated on
  # immich_host_mount_active / immich_ext_bind_stale anyway.
  ansible.builtin.set_fact:
    immich_ext_bind_mountinfo_re: '^[0-9]+ [0-9]+ {{ immich_host_mount_dev }} [^ ]+ /photos-external '

- name: Derive external library bind convergence
  # Single source of truth for the repair, the report and the assert below.
  # stale is only true when the host mount is active, the exec PROVENLY ran
  # (rc 0) and the pattern is absent from the container's mountinfo;
  # anything else is converged or UNKNOWN and never triggers churn.
  ansible.builtin.set_fact:
    immich_container_bind_seen: >-
      {{ (immich_container_bind_probe.rc | default(125)) == 0
         and ((immich_container_bind_probe.stdout_lines | default([])
               | select('match', immich_ext_bind_mountinfo_re) | list | length) > 0) }}
    immich_ext_bind_stale: >-
      {{ (immich_host_mount_active | bool)
         and (immich_container_bind_probe.rc | default(125)) == 0
         and not ((immich_container_bind_probe.stdout_lines | default([])
                   | select('match', immich_ext_bind_mountinfo_re) | list | length) > 0) }}

- name: Report external library bind view
  ansible.builtin.debug:
    msg: >-
      External library bind /photos-external:
      {{ 'host mount inactive (NAS export unavailable); container bind check skipped, startup untouched.'
         if not (immich_host_mount_active | bool)
         else ('UNKNOWN: container probe failed (rc '
         ~ (immich_container_bind_probe.rc | default('n/a'))
         ~ '); leaving the stack untouched.'
         if (immich_container_bind_probe.rc | default(125)) != 0
         else ('converged: container mountinfo shows host share device '
         ~ immich_host_mount_dev ~ ' at /photos-external.'
         if immich_container_bind_seen | bool
         else ('STALE: host has the share mounted (device '
         ~ immich_host_mount_dev
         ~ ') but the running container does not see it at /photos-external
         (boot race); recreating the server service now.'))) }}

- name: Repair stale external library bind
  # Only a recreate fixes a stale rprivate bind: the container's bind mounts
  # are re-established from the live host tree when the container is
  # created. recreate: always is the collection parameter that maps to
  # docker compose up --force-recreate (verified against the installed
  # community.docker docker_compose_v2 source: get_up_cmd emits
  # --force-recreate when recreate == 'always' and appends the services list
  # after '--'), so exactly immich-server is recreated while
  # redis/database/machine-learning are left running untouched. This is a
  # direct module call, NOT a handler and NOT another conditional
  # flush_handlers: it cannot strand the queued proxy/homepage handlers
  # (sibling finding t_57d1271b class).
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ immich_parent_folder }}"
    state: present
    recreate: always
    services:
      - immich-server
  when: immich_ext_bind_stale | bool

- name: Re-probe container view after bind repair
  become: false
  ansible.builtin.command:
    cmd: docker exec immich_server cat /proc/self/mountinfo
  register: immich_container_bind_reprobe
  changed_when: false
  check_mode: false
  ignore_errors: true
  when: immich_ext_bind_stale | bool

- name: Assert external library bind converged after repair
  ansible.builtin.assert:
    that:
      - (immich_container_bind_reprobe.rc | default(125)) == 0
      - ((immich_container_bind_reprobe.stdout_lines | default([])
          | select('match', immich_ext_bind_mountinfo_re) | list | length) > 0)
    fail_msg: >-
      immich_server was recreated but its /photos-external still does not
      show the host share device {{ immich_host_mount_dev }}. Check the NFS
      export and the container's mount namespace manually.
    success_msg: >-
      immich_server sees the host share at /photos-external after recreate.
  when: immich_ext_bind_stale | bool

# Check if Immich port is open and listening
- name: Check if Immich port is open and listening
  community.general.listen_ports_facts:

- name: Assert Immich port is listening
  ansible.builtin.assert:
    that:
      - immich_port | int in (ansible_facts.tcp_listen | map(attribute='port') | list)
    fail_msg: "Immich port {{ immich_port }} is not open and listening!"
    success_msg: "Immich port {{ immich_port }} is open and listening."

# Proxy Configuration
- name: Configure nginx proxy for immich
  when: immich_configure_proxy | default(true)
  block:
    - name: Get immich host IP for proxy
      ansible.builtin.set_fact:
        immich_proxy_ip: "{{ ansible_default_ipv4.address }}"

    - name: Deploy immich nginx proxy config
      ansible.builtin.template:
        src: "templates/immich.subdomain.conf.j2"
        dest: "{{ proxy_folder }}/internal/nginx/proxy-confs/immich.subdomain.conf"
        # SWAG normalizes proxy-confs to 0664 at startup (verified live on the
        # proxy host: every non-sample file in proxy-confs is -rw-rw-r--);
        # deploying anything else guarantees a mode-only change + restart.
        mode: '0664'
        owner: "{{ docker_user }}"
        group: "{{ docker_user }}"
      delegate_to: "{{ groups['proxy_host'][0] }}"
      notify: Restart Swag Internal

# DNS Configuration
- name: Ensure deployment host DNS override exists
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/pfsense_dns_ensure_host_override.yaml"
  vars:
    _dns_configure: "{{ immich_configure_dns | default(true) }}"
  when: immich_configure_dns | default(true)

- name: Create immich DNS alias
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/pfsense_dns_create_alias.yaml"
  vars:
    _dns_configure: "{{ immich_configure_dns | default(true) }}"
    _dns_alias_host: immich
    _dns_alias_descr: Immich photo library
    _dns_is_proxied: true
  when: immich_configure_dns | default(true)

# Homepage Configuration
- name: Add immich service to Homepage Media section
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/homepage_add_service.yaml"
  vars:
    _homepage_service_name: Immich
    _homepage_marker: immich service
    _homepage_template: immich_service.yaml.j2
    _homepage_insertafter: "^- Media:"
  when: immich_configure_homepage | default(true)
  tags:
    - homepage
    - homepage_config

- name: Notify Homepage restart for immich
  ansible.builtin.debug:
    msg: "immich homepage entry updated"
  changed_when: _homepage_service_result is changed
  notify: Restart Homepage
  when: immich_configure_homepage | default(true)
  tags:
    - homepage
    - homepage_config
