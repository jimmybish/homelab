---
# set_fact values survive later plays for the same host, so the accumulators
# below are reset on every role execution before the derive loop appends to
# them. Without this, a second execution in one playbook run would double the
# list accumulators while the keyed api_configs dict only merges.
- name: Reset Open WebUI Hermes connection accumulators
  ansible.builtin.set_fact:
    open_webui_openai_api_base_urls_hermes: []
    open_webui_openai_api_keys_hermes: []
    open_webui_provider_configs_hermes: []
    open_webui_openai_api_configs: {}
  no_log: true

- name: Derive Open WebUI Hermes provider connections
  ansible.builtin.set_fact:
    open_webui_openai_api_base_urls_hermes: "{{ open_webui_openai_api_base_urls_hermes + [endpoint.base_url] }}"
    open_webui_openai_api_keys_hermes: "{{ open_webui_openai_api_keys_hermes + [endpoint.key] }}"
    open_webui_provider_configs_hermes: "{{ open_webui_provider_configs_hermes + [endpoint.config] }}"
    open_webui_openai_api_configs: "{{ open_webui_openai_api_configs | combine({((idx | int) + 1) | string: endpoint.config}) }}"
  vars:
    endpoint:
      base_url: >-
        {{ internal_hermes_api_url if item == 'default'
           else internal_hermes_api_url | regex_replace('/v1$', '/p/' ~ item ~ '/v1') }}
      key: "{{ open_webui_hermes_profile_keys[item] | default(hermes_api_server_key) }}"
      config:
        enable: "{{ item not in (open_webui_hermes_disabled_profiles | default([])) }}"
        prefix_id: "{{ open_webui_hermes_profile_prefixes[item] | default(item) }}"
  loop: "{{ open_webui_hermes_profiles }}"
  loop_control:
    index_var: idx
    label: "{{ item }}"
  no_log: true

- name: Compose Open WebUI OpenAI provider lists
  ansible.builtin.set_fact:
    open_webui_openai_api_base_urls: "{{ [open_webui_sparky_base_url] + (open_webui_openai_api_base_urls_hermes | default([])) }}"
    open_webui_openai_api_keys: "{{ [''] + (open_webui_openai_api_keys_hermes | default([])) }}"
    open_webui_openai_api_configs: >-
      {{ {'0': {'enable': true, 'prefix_id': 'sparky'}}
         | combine(open_webui_openai_api_configs | default({})) }}
    open_webui_expected_provider_configs: >-
      {{ [{'enable': true, 'prefix_id': 'sparky'}]
         + (open_webui_provider_configs_hermes | default([])) }}
  no_log: true

- name: Check whether Open WebUI is already installed
  ansible.builtin.stat:
    path: "{{ open_webui_database_path }}"
  register: open_webui_database_stat

- name: Assert Open WebUI installation state
  ansible.builtin.assert:
    that:
      - >-
        not open_webui_database_stat.stat.exists or
        open_webui_database_stat.stat.isreg
    fail_msg: >-
      Open WebUI database path {{ open_webui_database_path }} exists but is not
      a regular file.
    success_msg: >-
      Open WebUI is {{ 'already installed' if open_webui_database_stat.stat.exists
      else 'not installed; a new deployment will be initialized' }}.

- name: Record Open WebUI installation state
  ansible.builtin.set_fact:
    open_webui_is_installed: "{{ open_webui_database_stat.stat.exists }}"

- name: Ensure docker-compose is installed
  ansible.builtin.package:
    name: docker-compose
    state: present

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Setup Open WebUI directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
  loop:
    - path: "{{ open_webui_folder }}"
      owner: "{{ docker_user }}"
      group: "{{ docker_user }}"
    - path: "{{ open_webui_data_folder }}"
      owner: "{{ open_webui_container_uid }}"
      group: "{{ open_webui_container_gid }}"

- name: Check Open WebUI config migration marker
  ansible.builtin.stat:
    path: "{{ open_webui_config_migration_marker }}"
  register: open_webui_config_migration_marker_stat

- name: Prepare Open WebUI config migration
  when:
    - open_webui_is_installed
    - not open_webui_config_migration_marker_stat.stat.exists
    - not ansible_check_mode
  block:
    - name: Setup protected Open WebUI backup directory
      ansible.builtin.file:
        path: "{{ open_webui_backup_folder }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Find managed Open WebUI database backups
      ansible.builtin.find:
        paths: "{{ open_webui_backup_folder }}"
        patterns: 'webui.db.pre-*.bak'
        file_type: file
        recurse: false
      register: open_webui_database_backups

    - name: Remove older Open WebUI database backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: >-
        {{ (open_webui_database_backups.files
            | sort(attribute='mtime', reverse=true))[1:] }}
      loop_control:
        label: "{{ item.path }}"

    - name: Backup Open WebUI database before config migration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |-
            import os
            import sqlite3
            import sys

            temporary_path = f'{sys.argv[2]}.tmp'
            try:
              os.unlink(temporary_path)
            except FileNotFoundError:
              pass
            with sqlite3.connect(sys.argv[1]) as source:
              with sqlite3.connect(temporary_path) as destination:
                    source.backup(destination)
                    result = destination.execute('PRAGMA integrity_check').fetchone()[0]
                    if result != 'ok':
                        raise RuntimeError(f'Backup integrity check failed: {result}')
            os.replace(temporary_path, sys.argv[2])
          - "{{ open_webui_database_path }}"
          - "{{ open_webui_config_backup_path }}"
        creates: "{{ open_webui_config_backup_path }}"

    - name: Protect Open WebUI config backup
      ansible.builtin.file:
        path: "{{ open_webui_config_backup_path }}"
        state: file
        owner: root
        group: root
        mode: '0600'

- name: Allow Open WebUI port through UFW
  community.general.ufw:
    rule: allow
    port: "{{ open_webui_port | string }}"
    proto: tcp
  when: ansible_os_family == "Debian"

- name: Deploy Open WebUI using Docker Compose
  ansible.builtin.template:
    src: templates/docker_compose.yaml.j2
    dest: "{{ open_webui_folder }}/docker-compose.yaml"
    mode: '0640'
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    force: true
  no_log: true
  notify:
    - Restart Open WebUI

- name: Run Open WebUI Docker Compose project
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ open_webui_folder }}"
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 300

- name: Reseed Open WebUI config once from managed environment
  when:
    - open_webui_is_installed
    - not open_webui_config_migration_marker_stat.stat.exists
    - not ansible_check_mode
  block:
    - name: Deploy temporary Open WebUI config reset override
      ansible.builtin.copy:
        dest: "{{ open_webui_config_reset_override_path }}"
        owner: "{{ docker_user }}"
        group: "{{ docker_user }}"
        mode: '0640'
        content: |
          services:
            open-webui:
              environment:
                RESET_CONFIG_ON_START: "true"

    - name: Start Open WebUI once with config reset enabled
      become: false
      community.docker.docker_compose_v2:
        project_src: "{{ open_webui_folder }}"
        files:
          - docker-compose.yaml
          - "{{ open_webui_config_reset_override_path | basename }}"
        state: present
        recreate: always
        remove_orphans: true
        wait: true
        wait_timeout: 300

    - name: Verify reset-started Open WebUI is healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ open_webui_port }}/health"
        status_code: 200
      register: open_webui_reset_health
      until: open_webui_reset_health.status == 200
      retries: 12
      delay: 5
  always:
    - name: Remove temporary Open WebUI config reset override
      ansible.builtin.file:
        path: "{{ open_webui_config_reset_override_path }}"
        state: absent

    - name: Converge Open WebUI to config reset disabled
      become: false
      community.docker.docker_compose_v2:
        project_src: "{{ open_webui_folder }}"
        state: present
        recreate: always
        remove_orphans: true
        wait: true
        wait_timeout: 300

- name: Read persisted Open WebUI provider config
  become: false
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - open-webui
      - python
      - -c
      - |2-
        import json
        import sqlite3

        connection = sqlite3.connect('/app/backend/data/webui.db')
        keys = (
          'openai.api_base_urls',
          'openai.api_keys',
          'openai.api_configs',
          'ui.enable_signup',
        )
        config = {
          key: json.loads(
            connection.execute(
              'SELECT value FROM config WHERE key = ?', (key,)
            ).fetchone()[0]
          )
          for key in keys
        }
        print(json.dumps(config))
  register: open_webui_persisted_config_raw
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Store persisted Open WebUI provider config
  ansible.builtin.set_fact:
    open_webui_persisted_config: "{{ open_webui_persisted_config_raw.stdout | from_json }}"
  no_log: true
  when: not ansible_check_mode

- name: Assert persisted Open WebUI provider config
  ansible.builtin.assert:
    that:
      - open_webui_persisted_config['openai.api_base_urls'] == open_webui_openai_api_base_urls
      - open_webui_persisted_config['openai.api_keys'] | length == open_webui_openai_api_keys | length
      - open_webui_persisted_config['openai.api_keys'] == open_webui_openai_api_keys
      - open_webui_persisted_config['openai.api_configs'] | length == open_webui_expected_provider_configs | length
      - (range(open_webui_expected_provider_configs | length) | map('string')
         | map('extract', open_webui_persisted_config['openai.api_configs'])
         | map(attribute='enable') | map('bool') | list)
        == (open_webui_expected_provider_configs | map(attribute='enable') | map('bool') | list)
      - (range(open_webui_expected_provider_configs | length) | map('string')
         | map('extract', open_webui_persisted_config['openai.api_configs'])
         | map(attribute='prefix_id') | list)
        == (open_webui_expected_provider_configs | map(attribute='prefix_id') | list)
      - not (open_webui_persisted_config['ui.enable_signup'] | bool)
    fail_msg: Open WebUI did not persist the managed multi-provider configuration.
    success_msg: >-
      Open WebUI persisted all {{ open_webui_openai_api_base_urls | length }}
      managed prefixed providers with signup disabled.
  no_log: true
  when: not ansible_check_mode

- name: Record completed Open WebUI config migration
  when:
    - not open_webui_config_migration_marker_stat.stat.exists
    - not ansible_check_mode
  ansible.builtin.file:
    path: "{{ open_webui_config_migration_marker }}"
    state: touch
    owner: "{{ open_webui_container_uid }}"
    group: "{{ open_webui_container_gid }}"
    mode: '0600'

- name: Find stale Open WebUI config migration markers
  ansible.builtin.find:
    paths: "{{ open_webui_data_folder }}"
    patterns:
      - '.ansible-managed-config-*'
      - '.ansible-dual-openai-providers-v1'
    file_type: file
    recurse: false
    hidden: true
    excludes: "{{ open_webui_config_migration_marker | basename }}"
  register: open_webui_stale_config_migration_markers
  when: not ansible_check_mode

- name: Remove stale Open WebUI config migration markers
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ open_webui_stale_config_migration_markers.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: not ansible_check_mode

- name: Check service listening ports
  community.general.listen_ports_facts:

- name: Assert Open WebUI port is listening
  ansible.builtin.assert:
    that:
      - open_webui_port | int in (ansible_facts.tcp_listen | map(attribute='port') | list)
    fail_msg: "Open WebUI port is not open and listening!"
    success_msg: "Open WebUI port is open and listening."

- name: Resolve Open WebUI host IP for proxy configuration
  ansible.builtin.set_fact:
    open_webui_proxy_ip: "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}"
  when: open_webui_configure_proxy | default(true)

- name: Deploy Open WebUI nginx config to SWAG Internal
  ansible.builtin.template:
    src: open-webui.subdomain.conf.j2
    dest: "{{ proxy_folder }}/internal/nginx/proxy-confs/open-webui.subdomain.conf"
    mode: '0664'
  delegate_to: "{{ groups['proxy_host'][0] }}"
  notify:
    - Restart Swag Internal
  when: open_webui_configure_proxy | default(true)

- name: Ensure deployment host DNS override exists
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/pfsense_dns_ensure_host_override.yaml"
  vars:
    _dns_configure: "{{ open_webui_configure_dns | default(true) }}"
  when: open_webui_configure_dns | default(true)

- name: Create Open WebUI DNS alias
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/pfsense_dns_create_alias.yaml"
  vars:
    _dns_configure: "{{ open_webui_configure_dns | default(true) }}"
    _dns_alias_host: open-webui
    _dns_alias_descr: Self-hosted AI interface
    _dns_is_proxied: "{{ open_webui_is_proxied | default(true) }}"
  when: open_webui_configure_dns | default(true)

- name: Add Open WebUI to Homepage Slop section
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/homepage_add_service.yaml"
  vars:
    _homepage_service_name: Open WebUI
    _homepage_marker: open_webui service
    _homepage_template: open_webui_service.yaml.j2
    _homepage_insertafter: "^- Slop:"
  when: open_webui_configure_homepage | default(true)
  tags:
    - homepage
    - homepage_config

- name: Notify Homepage restart for Open WebUI
  ansible.builtin.debug:
    msg: "Open WebUI homepage entry updated"
  changed_when: _homepage_service_result is changed
  notify:
    - Restart Homepage
  when: open_webui_configure_homepage | default(true)
  tags:
    - homepage
    - homepage_config
...
