---
- name: Ensure docker-compose is installed
  ansible.builtin.package:
    name: docker-compose
    state: present

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Verify NVIDIA Container Toolkit can expose the GPU
  ansible.builtin.command:
    cmd: docker info
  register: comfyui_docker_info
  changed_when: false
  failed_when: "'nvidia' not in comfyui_docker_info.stdout"

- name: Setup ComfyUI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
  loop: "{{ [comfyui_folder, comfyui_build_folder] + (comfyui_data_directories | map('regex_replace', '^(.*)$', comfyui_folder + '/\\1') | list) }}"

- name: Allow ComfyUI port through UFW
  community.general.ufw:
    rule: allow
    port: "{{ comfyui_port }}"
    proto: tcp
  when: ansible_os_family == "Debian"

- name: Deploy ComfyUI Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ comfyui_build_folder }}/Dockerfile"
    mode: '0644'
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
  register: comfyui_dockerfile
  notify:
    - Restart ComfyUI

- name: Deploy ComfyUI Docker Compose configuration
  ansible.builtin.template:
    src: docker_compose.yaml.j2
    dest: "{{ comfyui_folder }}/docker-compose.yaml"
    mode: '0644'
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
  register: comfyui_compose
  notify:
    - Restart ComfyUI

- name: Build and run ComfyUI
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ comfyui_folder }}"
    state: present
    build: "{{ 'always' if (comfyui_dockerfile.changed or comfyui_compose.changed) else 'policy' }}"
    remove_orphans: true

- name: Wait for ComfyUI HTTP service
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ comfyui_port }}/"
    status_code: 200
    return_content: true
  register: comfyui_http
  until:
    - comfyui_http.status == 200
    - "'ComfyUI' in comfyui_http.content"
  retries: 30
  delay: 5

- name: Check if ComfyUI port is open and listening
  community.general.listen_ports_facts:

- name: Assert ComfyUI port is listening
  ansible.builtin.assert:
    that:
      - comfyui_port | int in (ansible_facts.tcp_listen | map(attribute='port') | list)
    fail_msg: "ComfyUI port {{ comfyui_port }} is not open and listening!"
    success_msg: "ComfyUI port {{ comfyui_port }} is open and listening."

- name: Ensure deployment host DNS override exists
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/pfsense_dns_ensure_host_override.yaml"
  vars:
    _dns_configure: "{{ comfyui_configure_dns | default(true) }}"
  when: comfyui_configure_dns | default(true)

- name: Create ComfyUI direct DNS alias
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/pfsense_dns_create_alias.yaml"
  vars:
    _dns_configure: "{{ comfyui_configure_dns | default(true) }}"
    _dns_alias_host: comfyui
    _dns_alias_descr: ComfyUI on Nova
    _dns_is_proxied: "{{ comfyui_is_proxied | default(false) }}"
  when: comfyui_configure_dns | default(true)

- name: Add ComfyUI to Homepage Slop section
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/homepage_add_service.yaml"
  vars:
    _homepage_service_name: ComfyUI
    _homepage_marker: comfyui service
    _homepage_template: comfyui_service.yaml.j2
    _homepage_insertafter: "^- Slop:"
  when: comfyui_configure_homepage | default(true)
  tags:
    - homepage
    - homepage_config

- name: Notify Homepage restart for ComfyUI
  ansible.builtin.debug:
    msg: "ComfyUI homepage entry updated"
  changed_when: _homepage_service_result is changed
  notify:
    - Restart Homepage
  when: comfyui_configure_homepage | default(true)
  tags:
    - homepage
    - homepage_config
