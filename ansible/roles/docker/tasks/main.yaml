---
- name: Set Docker apt repository for correct distribution
  ansible.builtin.set_fact:
    docker_apt_repository: >-
      {{
        'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ' ~ ansible_distribution_release ~ ' stable'
        if ansible_distribution == 'Ubuntu'
        else 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian ' ~ ansible_distribution_release ~ ' stable'
      }}
  when: docker_manage_installation | default(true) | bool

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when: docker_manage_installation | default(true) | bool

- name: Configure Docker apt repository
  ansible.builtin.copy:
    content: "{{ docker_apt_repository }}\n"
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
  when: docker_manage_installation | default(true) | bool

- name: Remove role-managed Docker apt repository when installation is externally managed
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when: not (docker_manage_installation | default(true) | bool)
  tags:
    - docker_repository_cleanup

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure the docker user group exists for LinuxServer containers
  ansible.builtin.group:
    name: "{{ docker_user }}"
    state: present
    gid: 2001

- name: Add the docker user to the group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    comment: Docker User
    uid: 2001
    group: "{{ docker_user }}"

- name: Create Docker data folder
  ansible.builtin.file:
    path: /etc/docker-storage
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Ensure apt is using HTTPS
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - apt-transport-https
    - ca-certificates
    - curl
    - software-properties-common

- name: Install Docker CE
  ansible.builtin.apt:
    name: docker-ce
    state: present
    update_cache: true
  when: docker_manage_installation | default(true) | bool

- name: Configure Docker daemon options
  ansible.builtin.copy:
    content: >-
      {{
        docker_daemon_options
        | combine(docker_daemon_additional_options | default({}), recursive=true)
        | to_nice_json
      }}
    dest: "/etc/docker/daemon.json"
    owner: 'root'
    group: 'root'
    mode: '0644'
    backup: true
    validate: "/usr/bin/dockerd --validate --config-file=%s"
  notify: Restart Docker
  tags:
    - docker_daemon_config

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add managed users to Docker service groups
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - docker
      - "{{ docker_user }}"
    append: true
  loop: "{{ [os_configure_agent_user, owning_user] | unique }}"
  loop_control:
    label: "managed Docker user"
  throttle: 1
  tags:
    - agent_docker_groups

- name: Deploy Docker image cleanup script
  ansible.builtin.template:
    src: "templates/docker_image_cleanup.sh.j2"
    dest: "/usr/local/bin/docker-image-cleanup.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'

- name: Schedule weekly Docker image cleanup
  ansible.builtin.cron:
    name: "Docker image cleanup"
    job: "/usr/local/bin/docker-image-cleanup.sh >> /var/log/docker-image-cleanup.log 2>&1"
    weekday: "3"
    hour: "3"
    minute: "0"
    user: "root"

# cAdvisor - container monitoring for Prometheus
# Skipped on LXC containers as cAdvisor requires /proc mount access
- name: Allow cAdvisor port through UFW
  community.general.ufw:
    rule: allow
    port: "{{ docker_cadvisor_port }}"
    proto: tcp
  when:
    - ansible_os_family == "Debian"
    - inventory_hostname in groups.get('docker_vm_hosts', [])
  tags:
    - cadvisor

- name: Run cAdvisor container
  become: false
  community.docker.docker_container:
    name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ docker_cadvisor_port }}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
  when: inventory_hostname in groups.get('docker_vm_hosts', [])
  tags:
    - cadvisor

- name: Verify cAdvisor metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ docker_cadvisor_port }}/metrics"
    return_content: true
    status_code: 200
  register: docker_cadvisor_metrics
  retries: 5
  delay: 2
  until: "'container_last_seen' in docker_cadvisor_metrics.content"
  when: inventory_hostname in groups.get('docker_vm_hosts', [])
  tags:
    - cadvisor
