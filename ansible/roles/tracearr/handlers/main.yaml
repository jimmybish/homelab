---
- name: Start tracearr
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ tracearr_parent_folder }}"
    files:
      - docker-compose.yaml
    pull: "{{ tracearr_compose_pull | default('policy') }}"
    build: never
    state: restarted
    remove_orphans: true

- name: Restart Homepage
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_folder }}"
    state: restarted
  delegate_to: "{{ groups['homepage_host'][0] }}"

- name: Restart Swag Internal
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_folder }}"
    services:
      - swag_internal
    state: restarted
  delegate_to: "{{ groups['proxy_host'][0] }}"
