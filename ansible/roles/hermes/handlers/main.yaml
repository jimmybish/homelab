---
- name: Reload Hermes system systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Hermes dashboard
  ansible.builtin.systemd_service:
    name: "{{ hermes_service_name }}"
    state: restarted

- name: Restart Hermes gateway
  # WARNING: this unit hosts the embedded kanban dispatcher; restarting it
  # kills the dispatcher that spawned any running deploy worker. The unit is
  # managed with KillMode=process so in-flight workers survive the restart
  # (see hermes-gateway.service.j2). Do not weaken that without moving the
  # dispatcher out of this cgroup.
  ansible.builtin.systemd_service:
    name: "{{ hermes_gateway_service_name }}"
    state: restarted

- name: Reload Hermes user systemd
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus

- name: Restart Hermes Plexibot gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_plexibot_gateway_service_name }}"
    scope: user
    state: restarted
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus

- name: Restart Hermes VirtuaJimmy gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_virtuajimmy_gateway_service_name }}"
    scope: user
    state: restarted
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus

...
