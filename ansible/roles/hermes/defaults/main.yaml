# Plexibot SOUL service reference. URLs are thin aliases to the global
# direct-URL vars in group_vars/all/vars.yaml (owner directive 2026-09-17):
# every service URL exists once globally, derived from the inventory-based
# host vars (plex_host, media_stack_host, tracearr_host). Var NAMES are
# unchanged so templates/tasks need zero edits.
# Non-hostname private identifiers stay vaulted in group_vars/all.
# Verified against live listeners and Loki host labels 2026-09-16/17.
hermes_plexibot_plex_url: "{{ internal_plex_direct_url }}"
hermes_plexibot_sonarr_url: "{{ internal_sonarr_direct_url }}"
hermes_plexibot_radarr_url: "{{ internal_radarr_direct_url }}"
hermes_plexibot_prowlarr_url: "{{ internal_prowlarr_direct_url }}"
hermes_plexibot_lidarr_url: "{{ internal_lidarr_direct_url }}"
hermes_plexibot_sabnzbd_url: "{{ internal_sabnzbd_direct_url }}"
hermes_plexibot_qbittorrent_url: "{{ internal_qbittorrent_direct_url }}"
hermes_plexibot_tracearr_url: "{{ internal_tracearr_direct_url }}"
hermes_plexibot_user_map_csv: "{{ hermes_profiles_dir }}/plexibot/skills/discord-plex-user-mapping/user_map.csv"
hermes_hass_grafana_token_file: "{{ hermes_secrets_dir }}/hass-grafana-token"
