---
# Keep the application account independent from the Ansible transport user.
hermes_user: jimmy
hermes_user_home: "/home/{{ hermes_user }}"
hermes_home: "{{ hermes_user_home }}/.hermes"
hermes_install_dir: "{{ hermes_home }}/hermes-agent"
hermes_bin_dir: "{{ hermes_user_home }}/.local/bin"
hermes_bin: "{{ hermes_bin_dir }}/hermes"
hermes_skills_dir: "{{ hermes_home }}/skills"
hermes_config_file: "{{ hermes_home }}/config.yaml"
hermes_legacy_config_file: "{{ hermes_home }}/config.yml"
hermes_env_file: "{{ hermes_home }}/.env"
hermes_auth_file: "{{ hermes_home }}/auth.json"
hermes_agent_config_file: "{{ hermes_user_home }}/.hermes.md"
hermes_profiles_dir: "{{ hermes_home }}/profiles"
hermes_secrets_dir: "{{ hermes_home }}/secrets"
hermes_plexibot_grafana_token_file: "{{ hermes_secrets_dir }}/plexibot-grafana-token"
hermes_plexibot_soul_file: "{{ hermes_profiles_dir }}/plexibot/SOUL.md"
hermes_plexibot_usermap_bin: "{{ hermes_bin_dir }}/plexibot-usermap"
hermes_plexibot_meme_bin: "{{ hermes_bin_dir }}/plexibot-meme"
hermes_plexibot_meme_script: "{{ hermes_skills_dir }}/creative/meme-generation/scripts/generate_meme.py"
hermes_plexibot_user_map_csv: "{{ hermes_profiles_dir }}/plexibot/skills/discord-plex-user-mapping/user_map.csv"
hermes_hass_grafana_token_file: "{{ hermes_secrets_dir }}/hass-grafana-token"
hermes_virtuajimmy_profile_dir: "{{ hermes_profiles_dir }}/virtuajimmy"
hermes_virtuajimmy_config_file: "{{ hermes_virtuajimmy_profile_dir }}/config.yaml"
hermes_virtuajimmy_soul_file: "{{ hermes_virtuajimmy_profile_dir }}/SOUL.md"
hermes_virtuajimmy_env_file: "{{ hermes_virtuajimmy_profile_dir }}/.env"
hermes_virtuajimmy_ssh_dir: "{{ hermes_virtuajimmy_profile_dir }}/.ssh"
hermes_virtuajimmy_ssh_private_key_file: "{{ hermes_virtuajimmy_ssh_dir }}/id_ed25519"
hermes_virtuajimmy_user_ssh_dir: "{{ hermes_user_home }}/.ssh"
hermes_virtuajimmy_known_hosts_file: "{{ hermes_virtuajimmy_user_ssh_dir }}/known_hosts"
hermes_virtuajimmy_grafana_token_file: "{{ hermes_secrets_dir }}/virtuajimmy-grafana-token"
hermes_local_tools_bin: "{{ hermes_bin_dir }}/hermes-local-tools"
hermes_virtuajimmy_triage_skill_file: "{{ hermes_virtuajimmy_profile_dir }}/skills/kanban-task-triage/SKILL.md"
hermes_virtuajimmy_local_documents:
  config: "{{ hermes_virtuajimmy_config_file }}"
  soul: "{{ hermes_virtuajimmy_soul_file }}"
  triage_skill: "{{ hermes_virtuajimmy_triage_skill_file }}"
hermes_mcp_grafana_install_root: "{{ hermes_user_home }}/.local/lib/mcp-grafana"
hermes_mcp_grafana_bin: "{{ hermes_bin_dir }}/mcp-grafana"
hermes_plexibot_mcp_tracearr_url: "http://{{ groups['mcp_tracearr_host'][0] }}:8850"
hermes_plexibot_mcp_sonarr_url: "http://{{ groups['mcp_sonarr_host'][0] }}:8851"
hermes_plexibot_mcp_radarr_url: "http://{{ groups['mcp_radarr_host'][0] }}:8852"
hermes_virtuajimmy_mcp_context7_url: "https://mcp.context7.com/mcp"
hermes_virtuajimmy_mcp_tracearr_url: "{{ hermes_plexibot_mcp_tracearr_url }}"
hermes_virtuajimmy_mcp_sonarr_url: "{{ hermes_plexibot_mcp_sonarr_url }}"
hermes_virtuajimmy_mcp_radarr_url: "{{ hermes_plexibot_mcp_radarr_url }}"
hermes_virtuajimmy_context7_api_key: ""
hermes_virtuajimmy_grafana_api_token: "{{ hermes_plexibot_grafana_api_token }}"
hermes_virtuajimmy_discord_token: "{{ n8n_discord_bot_token }}"
hermes_virtuajimmy_discord_user_id: "{{ n8n_discord_author_id }}"
hermes_virtuajimmy_discord_control_channel_id: "{{ virtuajimmy_discord_control_channel_id }}"
hermes_virtuajimmy_ssh_host: "{{ n8n_copilot_mgmt_host }}"
hermes_virtuajimmy_ssh_user: "{{ n8n_copilot_mgmt_user }}"
hermes_virtuajimmy_ssh_private_key: "{{ n8n_copilot_ssh_key }}"
hermes_virtuajimmy_ssh_host_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICBey71W+zwoAmxupU/7WXTox6Fz2LmPK1cymZNs+UzG"
hermes_virtuajimmy_ssh_host_fingerprint: "SHA256:R/RfR2+noRrqrILqws0diKdQ1HZOYz7MeBhqguLpzPs"
hermes_virtuajimmy_remote_cwd: /srv/homelab
hermes_copilot_model: gpt-5.6-sol
hermes_copilot_profile_dir: "{{ hermes_profiles_dir }}/copilot"
hermes_copilot_config_file: "{{ hermes_copilot_profile_dir }}/config.yaml"
hermes_copilot_soul_file: "{{ hermes_copilot_profile_dir }}/SOUL.md"
hermes_copilot_baseline_file: "{{ hermes_copilot_profile_dir }}/REPO_BASELINE.md"
hermes_copilot_review_skill_file: "{{ hermes_copilot_profile_dir }}/skills/copilot-review/SKILL.md"
hermes_copilot_env_file: "{{ hermes_copilot_profile_dir }}/.env"
hermes_copilot_ssh_dir: "{{ hermes_copilot_profile_dir }}/.ssh"
hermes_copilot_ssh_private_key_file: "{{ hermes_copilot_ssh_dir }}/id_ed25519"
hermes_copilot_local_documents:
  config: "{{ hermes_copilot_config_file }}"
  soul: "{{ hermes_copilot_soul_file }}"
  repo_baseline: "{{ hermes_copilot_baseline_file }}"
  review_skill: "{{ hermes_copilot_review_skill_file }}"
hermes_copilot_remote_cwd: "{{ hermes_virtuajimmy_remote_cwd }}"
hermes_copilot_ssh_host: "{{ hermes_virtuajimmy_ssh_host }}"
hermes_copilot_ssh_user: "{{ hermes_virtuajimmy_ssh_user }}"
hermes_copilot_ssh_private_key: "{{ hermes_virtuajimmy_ssh_private_key }}"
hermes_managed_profiles:
  - name: hass
    config_template: profile-hass-config.yaml.j2
  - name: plexibot
    config_template: profile-plexibot-config.yaml.j2
  - name: virtuajimmy
    config_template: profile-virtuajimmy-config.yaml.j2
  - name: copilot
    config_template: profile-copilot-config.yaml.j2

hermes_service_name: hermes-dashboard.service
hermes_service_unit_path: "/etc/systemd/system/{{ hermes_service_name }}"
hermes_service_source_path: "{{ hermes_home }}/{{ hermes_service_name }}"
hermes_gateway_service_name: hermes-gateway.service
hermes_gateway_service_unit_path: "/etc/systemd/system/{{ hermes_gateway_service_name }}"
hermes_gateway_service_source_path: "{{ hermes_home }}/{{ hermes_gateway_service_name }}"
hermes_user_systemd_dir: "{{ hermes_user_home }}/.config/systemd/user"
hermes_plexibot_gateway_service_name: hermes-gateway-plexibot.service
hermes_plexibot_gateway_service_unit_path: >-
  {{ hermes_user_systemd_dir }}/{{ hermes_plexibot_gateway_service_name }}
hermes_virtuajimmy_gateway_service_name: hermes-gateway-virtuajimmy.service
hermes_virtuajimmy_gateway_service_unit_path: >-
  {{ hermes_user_systemd_dir }}/{{ hermes_virtuajimmy_gateway_service_name }}
hermes_bind_address: "0.0.0.0"
hermes_port: 9119
hermes_api_server_bind_address: "0.0.0.0"
hermes_dashboard_auth_provider: basic
hermes_dashboard_process_name: hermes
hermes_gateway_process_name: hermes

hermes_model:
  default: qwen38-flash-next-nvfp4
  provider: custom
  base_url: "http://sparky.{{ internal_domain }}:4000"
  context_length: 262144

hermes_custom_providers:
  - name: Qwen 3.8 Flash Next NVFP4
    base_url: "http://sparky.{{ internal_domain }}:4000"
    model: qwen38-flash-next-nvfp4
    api_mode: anthropic_messages
    models:
      qwen38-flash-next-nvfp4:
        context_length: 262144

hermes_hass_url: "{{ internal_homeassistant_url }}"
hermes_dashboard_expected_text: Hermes

# Optional role-file or controller paths containing complete skill directories.
# Example: { name: deploy-runbook, category: devops, src: skills/deploy-runbook/ }
hermes_custom_skills: []

...
