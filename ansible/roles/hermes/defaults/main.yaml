hermes_virtuajimmy_github_app_id: ""
hermes_virtuajimmy_github_app_installation_id: ""
hermes_virtuajimmy_github_app_private_key: ""
hermes_virtuajimmy_github_app_allowed_repositories:
  - jimmybish/homelab
hermes_virtuajimmy_github_app_skill_dir: >-
