---
- name: Look up Hermes account
  ansible.builtin.getent:
    database: passwd
    key: "{{ hermes_user }}"

- name: Verify audited Hermes account home
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[hermes_user][4] == hermes_user_home
    fail_msg: >-
      Hermes account {{ hermes_user }} has home
      {{ ansible_facts.getent_passwd[hermes_user][4] }}, expected
      {{ hermes_user_home }}.

- name: Enable lingering for the Hermes account
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ hermes_user }}"
    creates: "/var/lib/systemd/linger/{{ hermes_user }}"

- name: Ensure the Hermes user service manager is running
  ansible.builtin.systemd_service:
    name: "user@{{ ansible_facts.getent_passwd[hermes_user][1] }}.service"
    state: started

- name: Install Hermes system prerequisites
  ansible.builtin.apt:
    name: "{{ hermes_required_packages }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Create Hermes directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hermes_bin_dir }}"
      mode: '0775'
    - path: "{{ hermes_home }}"
      mode: '0700'
    - path: "{{ hermes_skills_dir }}"
      mode: '0700'
    - path: "{{ hermes_secrets_dir }}"
      mode: '0700'
    - path: "{{ hermes_mcp_grafana_install_dir }}"
      mode: '0755'
    - path: "{{ hermes_user_systemd_dir }}"
      mode: '0755'

- name: Download pinned Grafana MCP server archive
  ansible.builtin.get_url:
    url: "{{ hermes_mcp_grafana_archive_url }}"
    dest: "{{ hermes_mcp_grafana_archive_path }}"
    checksum: "{{ hermes_mcp_grafana_archive_checksum }}"
    owner: root
    group: root
    mode: '0644'

- name: Install pinned Grafana MCP server
  ansible.builtin.unarchive:
    src: "{{ hermes_mcp_grafana_archive_path }}"
    dest: "{{ hermes_mcp_grafana_install_dir }}"
    remote_src: true
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'
    creates: "{{ hermes_mcp_grafana_install_dir }}/mcp-grafana"
  notify: Restart Hermes Plexibot gateway

- name: Link Grafana MCP server into the Hermes executable path
  ansible.builtin.file:
    src: "{{ hermes_mcp_grafana_install_dir }}/mcp-grafana"
    dest: "{{ hermes_mcp_grafana_bin }}"
    state: link
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    force: true
  notify: Restart Hermes Plexibot gateway

- name: Verify Grafana MCP server version
  ansible.builtin.command:
    argv:
      - "{{ hermes_mcp_grafana_bin }}"
      - --version
  become: true
  become_user: "{{ hermes_user }}"
  register: hermes_mcp_grafana_version_result
  changed_when: false
  failed_when: >-
    hermes_mcp_grafana_version_result.rc != 0 or
    hermes_mcp_grafana_version not in
    (hermes_mcp_grafana_version_result.stdout + hermes_mcp_grafana_version_result.stderr)

- name: Create managed Hermes profile directories
  ansible.builtin.file:
    path: "{{ hermes_profiles_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'
  loop: "{{ hermes_managed_profiles }}"
  loop_control:
    label: "{{ item.name }}"

- name: Download pinned official Hermes installer
  ansible.builtin.get_url:
    url: "{{ hermes_installer_url }}"
    dest: "{{ hermes_installer_path }}"
    checksum: "{{ hermes_installer_checksum }}"
    owner: root
    group: root
    mode: '0755'

- name: Inspect Hermes installation artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_bin }}"
    - "{{ hermes_install_dir }}/venv/bin/python"
  register: hermes_install_artifacts

- name: Read installed Hermes commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_install_dir }}"
      - rev-parse
      - HEAD
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_user_home }}"
  register: hermes_installed_commit
  changed_when: false
  failed_when: false

- name: Install pinned Hermes commit
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ hermes_installer_path }}"
      - --commit
      - "{{ hermes_install_commit }}"
      - --skip-setup
      - --non-interactive
      - --dir
      - "{{ hermes_install_dir }}"
      - --hermes-home
      - "{{ hermes_home }}"
  become: true
  become_user: "{{ hermes_user }}"
  changed_when: true
  environment:
    HOME: "{{ hermes_user_home }}"
    USER: "{{ hermes_user }}"
  when: >-
    hermes_installed_commit.rc != 0 or
    hermes_installed_commit.stdout != hermes_install_commit or
    not (hermes_install_artifacts.results[0].stat.executable | default(false)) or
    not (hermes_install_artifacts.results[1].stat.executable | default(false))
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway
    - Restart Hermes Plexibot gateway

- name: Verify installed Hermes version
  ansible.builtin.command:
    argv:
      - "{{ hermes_bin }}"
      - --version
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_user_home }}"
  register: hermes_version_result
  changed_when: false
  failed_when: >-
    hermes_version_result.rc != 0 or
    ('Hermes Agent v' + hermes_version) not in hermes_version_result.stdout or
    ('(' + hermes_release + ')') not in hermes_version_result.stdout

- name: Verify installed Hermes commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_install_dir }}"
      - rev-parse
      - HEAD
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_user_home }}"
  register: hermes_verified_commit
  changed_when: false
  failed_when: >-
    hermes_verified_commit.rc != 0 or
    hermes_verified_commit.stdout != hermes_install_commit

- name: Deploy Hermes base agent config
  ansible.builtin.template:
    src: hermes.md.j2
    dest: "{{ hermes_agent_config_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Deploy Hermes config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_config_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: >-
      {{ hermes_install_dir }}/venv/bin/python -c
      'import pathlib,sys,yaml; yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))'
      %s
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Deploy Plexibot Grafana service-account token
  ansible.builtin.copy:
    content: "{{ hermes_plexibot_grafana_api_token }}{{ '\n' }}"
    dest: "{{ hermes_plexibot_grafana_token_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart Hermes Plexibot gateway

- name: Deploy managed Hermes non-gateway profile configs
  ansible.builtin.template:
    src: "{{ item.config_template }}"
    dest: "{{ hermes_profiles_dir }}/{{ item.name }}/config.yaml"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: >-
      {{ hermes_install_dir }}/venv/bin/python -c
      'import pathlib,sys,yaml; yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))'
      %s
  loop: >-
    {{ hermes_managed_profiles
       | rejectattr('name', 'equalto', 'plexibot')
       | list }}
  loop_control:
    label: "{{ item.name }}"

- name: Read deployed HASS profile config
  ansible.builtin.slurp:
    src: "{{ hermes_profiles_dir }}/hass/config.yaml"
  register: hermes_hass_profile_config

- name: Assert HASS profile capabilities
  ansible.builtin.assert:
    that:
      - "'homeassistant' in hermes_hass_config.platform_toolsets.homeassistant"
      - "'browser' in hermes_hass_config.platform_toolsets.homeassistant"
      - "'web' in hermes_hass_config.platform_toolsets.homeassistant"
      - "'browser' not in hermes_hass_config.agent.disabled_toolsets"
      - hermes_hass_config.browser.inactivity_timeout == 120
      - hermes_hass_config.browser.cloud_provider == 'firecrawl'
      - not hermes_hass_config.browser.use_gateway
      - hermes_hass_config.web.search_backend == 'firecrawl'
      - hermes_hass_config.web.extract_backend == 'firecrawl'
    fail_msg: >-
      The HASS profile must expose Home Assistant, browser, and web tools
      with the managed Firecrawl configuration.
    success_msg: "The HASS profile has Home Assistant and web content capabilities."
  vars:
    hermes_hass_config: >-
      {{ hermes_hass_profile_config.content | b64decode | from_yaml }}

- name: Deploy Plexibot Hermes profile config
  ansible.builtin.template:
    src: profile-plexibot-config.yaml.j2
    dest: "{{ hermes_profiles_dir }}/plexibot/config.yaml"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: >-
      {{ hermes_install_dir }}/venv/bin/python -c
      'import pathlib,sys,yaml; yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))'
      %s
  notify: Restart Hermes Plexibot gateway

- name: Deploy Hermes environment secrets
  ansible.builtin.template:
    src: hermes.env.j2
    dest: "{{ hermes_env_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Link HASS profile to Hermes environment secrets
  ansible.builtin.file:
    src: "{{ hermes_env_file }}"
    dest: "{{ hermes_profiles_dir }}/hass/.env"
    state: link
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    force: true

- name: Inspect HASS profile environment link
  ansible.builtin.stat:
    path: "{{ hermes_profiles_dir }}/hass/.env"
    follow: false
  register: hermes_hass_env_link

- name: Inspect HASS profile environment target
  ansible.builtin.stat:
    path: "{{ hermes_profiles_dir }}/hass/.env"
    follow: true
  register: hermes_hass_env_target
  no_log: true

- name: Assert secure HASS profile environment access
  ansible.builtin.assert:
    that:
      - hermes_hass_env_link.stat.islnk
      - hermes_hass_env_link.stat.lnk_source == hermes_env_file
      - hermes_hass_env_target.stat.isreg
      - hermes_hass_env_target.stat.pw_name == hermes_user
      - hermes_hass_env_target.stat.gr_name == hermes_user
      - hermes_hass_env_target.stat.mode == '0600'
    fail_msg: >-
      The HASS profile must link to the root Hermes environment file,
      owned by {{ hermes_user }} at mode 0600.
    success_msg: "The HASS profile securely shares the root Hermes environment."
  no_log: true

- name: Deploy Hermes provider credential store
  ansible.builtin.template:
    src: auth.json.j2
    dest: "{{ hermes_auth_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: "{{ hermes_install_dir }}/venv/bin/python -m json.tool %s"
  no_log: true
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Inspect Hermes configuration paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_config_file }}"
    - "{{ hermes_legacy_config_file }}"
  register: hermes_config_paths

- name: Assert authoritative Hermes configuration path
  ansible.builtin.assert:
    that:
      - hermes_config_paths.results[0].stat.exists
      - hermes_config_paths.results[0].stat.isreg
      - hermes_config_paths.results[0].stat.pw_name == hermes_user
      - hermes_config_paths.results[0].stat.gr_name == hermes_user
      - hermes_config_paths.results[0].stat.mode == '0600'
      - not hermes_config_paths.results[1].stat.exists
    fail_msg: >-
      Hermes requires {{ hermes_config_file }} at mode 0600 and does not read
      {{ hermes_legacy_config_file }}.
    success_msg: "Hermes is using the authoritative config.yaml path."

- name: Deploy managed Hermes custom skills
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: >-
      {{ hermes_skills_dir }}/{{ item.category | default('custom', true) }}/{{ item.name }}/
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: preserve
    directory_mode: '0700'
  loop: "{{ hermes_custom_skills }}"
  when: hermes_custom_skills | length > 0
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Allow Hermes service ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop:
    - "{{ hermes_port }}"
    - "{{ hermes_api_server_port }}"
  when: ansible_os_family == "Debian"

- name: Read UFW status for Hermes services
  ansible.builtin.command:
    argv:
      - ufw
      - status
  register: hermes_ufw_status
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Assert Hermes dashboard UFW rule is active
  ansible.builtin.assert:
    that:
      - "'Status: active' in hermes_ufw_status.stdout"
      - "(hermes_port | string) + '/tcp' in hermes_ufw_status.stdout"
      - "(hermes_api_server_port | string) + '/tcp' in hermes_ufw_status.stdout"
    fail_msg: >-
      UFW is not active with TCP ports {{ hermes_port }} and
      {{ hermes_api_server_port }} allowed.
    success_msg: >-
      UFW is active with TCP ports {{ hermes_port }} and
      {{ hermes_api_server_port }} allowed.
  when:
    - ansible_os_family == "Debian"
    - not ansible_check_mode

- name: Deploy Hermes dashboard service source
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: "{{ hermes_service_source_path }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes dashboard

- name: Deploy Hermes dashboard systemd unit
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: "{{ hermes_service_unit_path }}"
    owner: root
    group: root
    mode: '0600'
  notify:
    - Reload Hermes system systemd
    - Restart Hermes dashboard

- name: Deploy Hermes gateway service source
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "{{ hermes_gateway_service_source_path }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes gateway

- name: Deploy Hermes gateway systemd unit
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "{{ hermes_gateway_service_unit_path }}"
    owner: root
    group: root
    mode: '0600'
  notify:
    - Reload Hermes system systemd
    - Restart Hermes gateway

- name: Deploy Hermes Plexibot gateway user unit
  ansible.builtin.template:
    src: hermes-gateway-plexibot.service.j2
    dest: "{{ hermes_plexibot_gateway_service_unit_path }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'
  notify:
    - Reload Hermes user systemd
    - Restart Hermes Plexibot gateway

- name: Apply pending Hermes restart
  ansible.builtin.meta: flush_handlers

- name: Enable and start Hermes dashboard
  ansible.builtin.systemd_service:
    name: "{{ hermes_service_name }}"
    state: started
    enabled: true

- name: Enable and start Hermes gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_gateway_service_name }}"
    state: started
    enabled: true

- name: Enable and start Hermes Plexibot gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_plexibot_gateway_service_name }}"
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus

- name: Read Hermes dashboard service status
  ansible.builtin.systemd_service:
    name: "{{ hermes_service_name }}"
  register: hermes_service_status

- name: Read Hermes gateway service status
  ansible.builtin.systemd_service:
    name: "{{ hermes_gateway_service_name }}"
  register: hermes_gateway_service_status

- name: Read Hermes Plexibot gateway service status
  ansible.builtin.systemd_service:
    name: "{{ hermes_plexibot_gateway_service_name }}"
    scope: user
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus
  register: hermes_plexibot_gateway_service_status

- name: Assert Hermes dashboard service state
  ansible.builtin.assert:
    that:
      - hermes_service_status.status.ActiveState == 'active'
      - hermes_service_status.status.UnitFileState == 'enabled'
      - hermes_service_status.status.FragmentPath == hermes_service_unit_path
      - hermes_service_status.status.MainPID | int > 0
    fail_msg: "Hermes dashboard is not active and enabled from the managed unit."
    success_msg: "Hermes dashboard is active and enabled at boot."

- name: Assert Hermes gateway service state
  ansible.builtin.assert:
    that:
      - hermes_gateway_service_status.status.ActiveState == 'active'
      - hermes_gateway_service_status.status.UnitFileState == 'enabled'
      - hermes_gateway_service_status.status.FragmentPath == hermes_gateway_service_unit_path
      - hermes_gateway_service_status.status.MainPID | int > 0
    fail_msg: "Hermes gateway is not active and enabled from the managed unit."
    success_msg: "Hermes gateway is active and enabled at boot."

- name: Assert Hermes Plexibot gateway service state
  ansible.builtin.assert:
    that:
      - hermes_plexibot_gateway_service_status.status.ActiveState == 'active'
      - hermes_plexibot_gateway_service_status.status.UnitFileState == 'enabled'
      - >-
        hermes_plexibot_gateway_service_status.status.FragmentPath ==
        hermes_plexibot_gateway_service_unit_path
      - hermes_plexibot_gateway_service_status.status.MainPID | int > 0
    fail_msg: >-
      Hermes Plexibot gateway is not active and enabled from the managed user unit.
    success_msg: "Hermes Plexibot gateway is active and enabled at boot."

- name: Read Hermes Plexibot gateway process identity
  ansible.builtin.command:
    argv:
      - ps
      - -p
      - "{{ hermes_plexibot_gateway_service_status.status.MainPID }}"
      - -o
      - user=
      - -o
      - args=
  register: hermes_plexibot_gateway_process
  changed_when: false
  when: not ansible_check_mode

- name: Assert Hermes Plexibot gateway process identity
  ansible.builtin.assert:
    that:
      - >-
        hermes_plexibot_gateway_process.stdout is match(
          '^' + hermes_user + '\\s+'
        )
      - "'--profile plexibot gateway run' in hermes_plexibot_gateway_process.stdout"
    fail_msg: >-
      Hermes Plexibot gateway is not running as {{ hermes_user }} with the
      plexibot profile.
    success_msg: >-
      Hermes Plexibot gateway is running as {{ hermes_user }} with the
      plexibot profile.
  when: not ansible_check_mode

- name: Wait for Hermes dashboard listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ hermes_port }}"
    state: started
    timeout: 120

- name: Wait for Hermes API server listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ hermes_api_server_port }}"
    state: started
    timeout: 120

- name: Gather listening port facts
  community.general.listen_ports_facts:

- name: Select Hermes dashboard listeners
  ansible.builtin.set_fact:
    hermes_dashboard_listeners: >-
      {{ ansible_facts.tcp_listen
         | selectattr('port', 'equalto', hermes_port | int)
         | list }}

- name: Select Hermes API server listeners
  ansible.builtin.set_fact:
    hermes_api_server_listeners: >-
      {{ ansible_facts.tcp_listen
         | selectattr('port', 'equalto', hermes_api_server_port | int)
         | list }}

- name: Assert Hermes dashboard listener identity
  ansible.builtin.assert:
    that:
      - hermes_dashboard_listeners | length > 0
      - hermes_bind_address in (hermes_dashboard_listeners | map(attribute='address') | list)
      - hermes_user in (hermes_dashboard_listeners | map(attribute='user') | list)
      - hermes_dashboard_process_name in (hermes_dashboard_listeners | map(attribute='name') | list)
      - (hermes_service_status.status.MainPID | int) in (hermes_dashboard_listeners | map(attribute='pid') | list)
    fail_msg: >-
      Hermes dashboard is not listening as {{ hermes_user }} process
      {{ hermes_dashboard_process_name }} on {{ hermes_bind_address }}:{{ hermes_port }}.
    success_msg: >-
      Hermes dashboard is listening as {{ hermes_user }} process
      {{ hermes_dashboard_process_name }} on {{ hermes_bind_address }}:{{ hermes_port }}.

- name: Assert Hermes API server listener identity
  ansible.builtin.assert:
    that:
      - hermes_api_server_listeners | length > 0
      - hermes_api_server_bind_address in (hermes_api_server_listeners | map(attribute='address') | list)
      - hermes_user in (hermes_api_server_listeners | map(attribute='user') | list)
      - hermes_gateway_process_name in (hermes_api_server_listeners | map(attribute='name') | list)
      - (hermes_gateway_service_status.status.MainPID | int) in (hermes_api_server_listeners | map(attribute='pid') | list)
    fail_msg: >-
      Hermes API server is not listening as {{ hermes_user }} process
      {{ hermes_gateway_process_name }} on
      {{ hermes_api_server_bind_address }}:{{ hermes_api_server_port }}.
    success_msg: >-
      Hermes API server is listening as {{ hermes_user }} process
      {{ hermes_gateway_process_name }} on
      {{ hermes_api_server_bind_address }}:{{ hermes_api_server_port }}.

- name: Read Hermes dashboard public status
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/api/status"
    method: GET
    return_content: true
    status_code: 200
  register: hermes_dashboard_status
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Assert Hermes dashboard authentication gate
  ansible.builtin.assert:
    that:
      - hermes_dashboard_status.json.auth_required | bool
      - hermes_dashboard_auth_provider in (hermes_dashboard_status.json.auth_providers | default([]))
    fail_msg: "Hermes dashboard authentication is not active."
    success_msg: "Hermes dashboard authentication is active."
  when: not ansible_check_mode

- name: Verify unauthenticated Hermes dashboard redirect
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/"
    method: GET
    follow_redirects: none
    status_code: 302
  register: hermes_dashboard_unauthenticated
  changed_when: false
  when: not ansible_check_mode

- name: Assert unauthenticated Hermes dashboard requires login
  ansible.builtin.assert:
    that:
      - "'/login?next=' in hermes_dashboard_unauthenticated.location"
    fail_msg: "Hermes dashboard did not redirect an unauthenticated request to login."
    success_msg: "Hermes dashboard redirects unauthenticated requests to login."
  when: not ansible_check_mode

- name: Authenticate to Hermes dashboard
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/auth/password-login"
    method: POST
    body_format: json
    body:
      provider: "{{ hermes_dashboard_auth_provider }}"
      username: "{{ hermes_dashboard_basic_auth_username }}"
      password: "{{ hermes_dashboard_basic_auth_password }}"
      next: /
    return_content: true
    status_code: 200
  register: hermes_dashboard_login
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Verify authenticated Hermes dashboard identity
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/api/auth/me"
    method: GET
    headers:
      Cookie: "{{ hermes_dashboard_login.cookies_string }}"
    return_content: true
    status_code: 200
  register: hermes_dashboard_identity
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Assert authenticated Hermes dashboard identity
  ansible.builtin.assert:
    that:
      - hermes_dashboard_login.json.ok | bool
      - hermes_dashboard_login.json.next == '/'
      - hermes_dashboard_login.cookies_string | length > 0
      - hermes_dashboard_identity.json.provider == hermes_dashboard_auth_provider
      - hermes_dashboard_identity.json.user_id == hermes_dashboard_basic_auth_username
    fail_msg: "Hermes dashboard authentication did not return the expected identity."
    success_msg: "Hermes dashboard authentication returned the expected identity."
  no_log: true
  when: not ansible_check_mode

- name: Verify authenticated Hermes dashboard content
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/"
    method: GET
    headers:
      Cookie: "{{ hermes_dashboard_login.cookies_string }}"
    return_content: true
    status_code: 200
  register: hermes_dashboard_authenticated
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Assert authenticated Hermes dashboard content
  ansible.builtin.assert:
    that:
      - hermes_dashboard_expected_text in hermes_dashboard_authenticated.content
    fail_msg: "Authenticated port {{ hermes_port }} did not return the Hermes dashboard."
    success_msg: "Authenticated Hermes dashboard returned expected content."
  when: not ansible_check_mode

