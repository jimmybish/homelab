---
- name: Look up Hermes account
  ansible.builtin.getent:
    database: passwd
    key: "{{ hermes_user }}"

- name: Verify audited Hermes account home
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[hermes_user][4] == hermes_user_home
    fail_msg: >-
      Hermes account {{ hermes_user }} has home
      {{ ansible_facts.getent_passwd[hermes_user][4] }}, expected
      {{ hermes_user_home }}.

- name: Enable lingering for the Hermes account
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ hermes_user }}"
    creates: "/var/lib/systemd/linger/{{ hermes_user }}"

- name: Ensure the Hermes user service manager is running
  ansible.builtin.systemd_service:
    name: "user@{{ ansible_facts.getent_passwd[hermes_user][1] }}.service"
    state: started

- name: Install Hermes system prerequisites
  ansible.builtin.apt:
    name: "{{ hermes_required_packages }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Create Hermes directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hermes_bin_dir }}"
      mode: '0775'
    - path: "{{ hermes_home }}"
      mode: '0700'
    - path: "{{ hermes_skills_dir }}"
      mode: '0700'
    - path: "{{ hermes_secrets_dir }}"
      mode: '0700'
    - path: "{{ hermes_mcp_grafana_install_dir }}"
      mode: '0755'
    - path: "{{ hermes_user_systemd_dir }}"
      mode: '0755'

- name: Download pinned Grafana MCP server archive
  ansible.builtin.get_url:
    url: "{{ hermes_mcp_grafana_archive_url }}"
    dest: "{{ hermes_mcp_grafana_archive_path }}"
    checksum: "{{ hermes_mcp_grafana_archive_checksum }}"
    owner: root
    group: root
    mode: '0644'

- name: Install pinned Grafana MCP server
  ansible.builtin.unarchive:
    src: "{{ hermes_mcp_grafana_archive_path }}"
    dest: "{{ hermes_mcp_grafana_install_dir }}"
    remote_src: true
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'
    creates: "{{ hermes_mcp_grafana_install_dir }}/mcp-grafana"
  notify: Restart Hermes Plexibot gateway

- name: Link Grafana MCP server into the Hermes executable path
  ansible.builtin.file:
    src: "{{ hermes_mcp_grafana_install_dir }}/mcp-grafana"
    dest: "{{ hermes_mcp_grafana_bin }}"
    state: link
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    force: true
  notify: Restart Hermes Plexibot gateway

- name: Verify Grafana MCP server version
  ansible.builtin.command:
    argv:
      - "{{ hermes_mcp_grafana_bin }}"
      - --version
  become: true
  become_user: "{{ hermes_user }}"
  register: hermes_mcp_grafana_version_result
  changed_when: false
  failed_when: >-
    hermes_mcp_grafana_version_result.rc != 0 or
    hermes_mcp_grafana_version not in
    (hermes_mcp_grafana_version_result.stdout + hermes_mcp_grafana_version_result.stderr)

- name: Create managed Hermes profile directories
  ansible.builtin.file:
    path: "{{ hermes_profiles_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'
  loop: "{{ hermes_managed_profiles }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create VirtuaJimmy SSH directory
  ansible.builtin.file:
    path: "{{ hermes_virtuajimmy_ssh_dir }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'

- name: Create Hermes user SSH directory for VirtuaJimmy host trust
  ansible.builtin.file:
    path: "{{ hermes_virtuajimmy_user_ssh_dir }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'

- name: Install pinned VirtuaJimmy SSH host key for the exact host
  ansible.builtin.known_hosts:
    path: "{{ hermes_virtuajimmy_known_hosts_file }}"
    name: "{{ hermes_virtuajimmy_ssh_host }}"
    key: >-
      {{ hermes_virtuajimmy_ssh_host }} {{ hermes_virtuajimmy_ssh_host_public_key }}
    hash_host: true
    state: present

- name: Secure Hermes user known hosts
  ansible.builtin.file:
    path: "{{ hermes_virtuajimmy_known_hosts_file }}"
    state: file
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'

- name: Download pinned official Hermes installer
  ansible.builtin.get_url:
    url: "{{ hermes_installer_url }}"
    dest: "{{ hermes_installer_path }}"
    checksum: "{{ hermes_installer_checksum }}"
    owner: root
    group: root
    mode: '0755'

- name: Inspect Hermes installation artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_bin }}"
    - "{{ hermes_install_dir }}/venv/bin/python"
  register: hermes_install_artifacts

- name: Read installed Hermes commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_install_dir }}"
      - rev-parse
      - HEAD
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_user_home }}"
  register: hermes_installed_commit
  changed_when: false
  failed_when: false

- name: Install pinned Hermes commit
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ hermes_installer_path }}"
      - --commit
      - "{{ hermes_install_commit }}"
      - --skip-setup
      - --non-interactive
      - --dir
      - "{{ hermes_install_dir }}"
      - --hermes-home
      - "{{ hermes_home }}"
  become: true
  become_user: "{{ hermes_user }}"
  changed_when: true
  environment:
    HOME: "{{ hermes_user_home }}"
    USER: "{{ hermes_user }}"
  when: >-
    hermes_installed_commit.rc != 0 or
    hermes_installed_commit.stdout != hermes_install_commit or
    not (hermes_install_artifacts.results[0].stat.executable | default(false)) or
    not (hermes_install_artifacts.results[1].stat.executable | default(false))
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway
    - Restart Hermes Plexibot gateway

- name: Verify installed Hermes version
  ansible.builtin.command:
    argv:
      - "{{ hermes_bin }}"
      - --version
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_user_home }}"
  register: hermes_version_result
  changed_when: false
  failed_when: >-
    hermes_version_result.rc != 0 or
    ('Hermes Agent v' + hermes_version) not in hermes_version_result.stdout or
    ('(' + hermes_release + ')') not in hermes_version_result.stdout

- name: Verify installed Hermes commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_install_dir }}"
      - rev-parse
      - HEAD
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_user_home }}"
  register: hermes_verified_commit
  changed_when: false
  failed_when: >-
    hermes_verified_commit.rc != 0 or
    hermes_verified_commit.stdout != hermes_install_commit

- name: Deploy Hermes base agent config
  ansible.builtin.template:
    src: hermes.md.j2
    dest: "{{ hermes_agent_config_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Deploy Hermes config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_config_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: >-
      {{ hermes_install_dir }}/venv/bin/python -c
      'import pathlib,sys,yaml; yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))'
      %s
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Deploy Plexibot Grafana service-account token
  ansible.builtin.copy:
    content: "{{ hermes_plexibot_grafana_api_token }}{{ '\n' }}"
    dest: "{{ hermes_plexibot_grafana_token_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart Hermes Plexibot gateway

- name: Deploy HASS Grafana service-account token
  ansible.builtin.copy:
    content: "{{ hermes_hass_grafana_api_token }}{{ '\n' }}"
    dest: "{{ hermes_hass_grafana_token_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  diff: false

- name: Deploy VirtuaJimmy Grafana service-account token
  ansible.builtin.copy:
    content: "{{ hermes_virtuajimmy_grafana_api_token }}{{ '\n' }}"
    dest: "{{ hermes_virtuajimmy_grafana_token_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart Hermes VirtuaJimmy gateway

- name: Deploy profile-local Hermes MCP server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../mcp-server-hermes-local-tools/server.py"
    dest: "{{ hermes_local_tools_bin }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'
    validate: >-
      {{ hermes_install_dir }}/venv/bin/python -c
      'import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))'
      %s
  notify:
    - Restart Hermes dashboard
    - Restart Hermes VirtuaJimmy gateway

- name: Remove obsolete VirtuaJimmy intake helper
  ansible.builtin.file:
    path: "{{ hermes_bin_dir }}/hermes-vj-intake"
    state: absent
  notify: Restart Hermes VirtuaJimmy gateway

- name: Deploy managed Hermes non-gateway profile configs
  ansible.builtin.template:
    src: "{{ item.config_template }}"
    dest: "{{ hermes_profiles_dir }}/{{ item.name }}/config.yaml"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: >-
      {{ hermes_install_dir }}/venv/bin/python -c
      'import pathlib,sys,yaml; yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))'
      %s
  loop: >-
    {{ hermes_managed_profiles
       | rejectattr('name', 'equalto', 'plexibot')
       | rejectattr('name', 'equalto', 'virtuajimmy')
       | list }}
  loop_control:
    label: "{{ item.name }}"
  notify: Restart Hermes dashboard

- name: Read deployed HASS profile config
  ansible.builtin.slurp:
    src: "{{ hermes_profiles_dir }}/hass/config.yaml"
  register: hermes_hass_profile_config

- name: Assert HASS profile capabilities
  ansible.builtin.assert:
    that:
      - "'homeassistant' in hermes_hass_config.platform_toolsets.homeassistant"
      - "'browser' in hermes_hass_config.platform_toolsets.homeassistant"
      - "'web' in hermes_hass_config.platform_toolsets.homeassistant"
      - "'browser' not in hermes_hass_config.agent.disabled_toolsets"
      - hermes_hass_config.browser.inactivity_timeout == 120
      - hermes_hass_config.browser.cloud_provider == 'firecrawl'
      - not hermes_hass_config.browser.use_gateway
      - hermes_hass_config.web.search_backend == 'firecrawl'
      - hermes_hass_config.web.extract_backend == 'firecrawl'
      - hermes_hass_config.mcp_servers.grafana.command == hermes_mcp_grafana_bin
      - hermes_hass_config.mcp_servers.grafana.args == ['--enabled-tools', 'datasource,prometheus,loki', '--disable-write', '--disable-proxied']
      - hermes_hass_config.mcp_servers.grafana.env.GRAFANA_URL == internal_grafana_url
      - hermes_hass_config.mcp_servers.grafana.env.GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE == hermes_hass_grafana_token_file
      - hermes_hass_config.mcp_servers.grafana.enabled
    fail_msg: >-
      The HASS profile must expose Home Assistant, browser, and web tools with
      the managed Firecrawl configuration and exact read-only Grafana MCP settings.
    success_msg: >-
      The HASS profile has Home Assistant, web content, and read-only Grafana MCP
      capabilities.
  vars:
    hermes_hass_config: >-
      {{ hermes_hass_profile_config.content | b64decode | from_yaml }}

- name: Deploy Plexibot Hermes profile config
  ansible.builtin.template:
    src: profile-plexibot-config.yaml.j2
    dest: "{{ hermes_profiles_dir }}/plexibot/config.yaml"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: >-
      {{ hermes_install_dir }}/venv/bin/python -c
      'import pathlib,sys,yaml; yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))'
      %s
  notify: Restart Hermes Plexibot gateway

- name: Deploy Plexibot identity
  ansible.builtin.template:
    src: profile-plexibot-soul.md.j2
    dest: "{{ hermes_plexibot_soul_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes Plexibot gateway

- name: Deploy Plexibot user-map helper script
  ansible.builtin.template:
    src: hermes-user-map.py.j2
    dest: "{{ hermes_plexibot_usermap_bin }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'

- name: Deploy Plexibot meme wrapper script
  ansible.builtin.template:
    src: hermes-meme.py.j2
    dest: "{{ hermes_plexibot_meme_bin }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'

- name: Deploy VirtuaJimmy Hermes profile config
  ansible.builtin.template:
    src: profile-virtuajimmy-config.yaml.j2
    dest: "{{ hermes_virtuajimmy_config_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: >-
      {{ hermes_install_dir }}/venv/bin/python -c
      'import pathlib,sys,yaml; yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))'
      %s
  notify: Restart Hermes VirtuaJimmy gateway

- name: Deploy VirtuaJimmy identity
  ansible.builtin.template:
    src: profile-virtuajimmy-soul.md.j2
    dest: "{{ hermes_virtuajimmy_soul_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes VirtuaJimmy gateway

- name: Deploy VirtuaJimmy kanban-task-triage skill
  ansible.builtin.template:
    src: skill-kanban-task-triage.md.j2
    dest: "{{ hermes_virtuajimmy_triage_skill_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'
    directory_mode: '0700'
  notify: Restart Hermes VirtuaJimmy gateway

- name: Create VirtuaJimmy PII pre-review skill directory
  ansible.builtin.file:
    path: "{{ hermes_virtuajimmy_pii_skill_file | dirname }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'

- name: Deploy VirtuaJimmy PII pre-review skill
  ansible.builtin.template:
    src: skill-pii-pre-review.md.j2
    dest: "{{ hermes_virtuajimmy_pii_skill_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes VirtuaJimmy gateway

- name: Deploy VirtuaJimmy profile environment
  ansible.builtin.template:
    src: profile-virtuajimmy.env.j2
    dest: "{{ hermes_virtuajimmy_env_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart Hermes VirtuaJimmy gateway

- name: Deploy VirtuaJimmy SSH private key
  ansible.builtin.copy:
    content: "{{ hermes_virtuajimmy_ssh_private_key }}{{ '\n' }}"
    dest: "{{ hermes_virtuajimmy_ssh_private_key_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart Hermes VirtuaJimmy gateway

- name: Create Copilot SSH directory
  ansible.builtin.file:
    path: "{{ hermes_copilot_ssh_dir }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'

- name: Deploy Copilot SSH private key
  ansible.builtin.copy:
    content: "{{ hermes_copilot_ssh_private_key }}{{ '\n' }}"
    dest: "{{ hermes_copilot_ssh_private_key_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  diff: false

- name: Deploy Copilot profile metadata
  ansible.builtin.copy:
    content: |
      description: Chat profile backed by GitHub Copilot as the model provider.
      description_auto: false
    dest: "{{ hermes_copilot_profile_dir }}/profile.yaml"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'

- name: Deploy Copilot identity
  ansible.builtin.template:
    src: profile-copilot-soul.md.j2
    dest: "{{ hermes_copilot_soul_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes dashboard

- name: Deploy Copilot repo baseline
  ansible.builtin.template:
    src: profile-copilot-baseline.md.j2
    dest: "{{ hermes_copilot_baseline_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes dashboard

- name: Create Copilot skills directory
  ansible.builtin.file:
    path: "{{ hermes_copilot_profile_dir }}/skills/copilot-review"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'

- name: Deploy Copilot review skill
  ansible.builtin.template:
    src: skill-copilot-review.md.j2
    dest: "{{ hermes_copilot_review_skill_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    directory_mode: '0700'
  notify: Restart Hermes dashboard

- name: Create Copilot public repository audit skill directory
  ansible.builtin.file:
    path: "{{ hermes_copilot_audit_skill_file | dirname }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'

- name: Deploy Copilot public repository audit skill
  ansible.builtin.template:
    src: skill-public-repo-audit.md.j2
    dest: "{{ hermes_copilot_audit_skill_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes dashboard

- name: Deploy Copilot profile environment
  ansible.builtin.template:
    src: profile-copilot.env.j2
    dest: "{{ hermes_copilot_env_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  diff: false

- name: Read deployed Copilot profile config
  ansible.builtin.slurp:
    src: "{{ hermes_copilot_config_file }}"
  register: hermes_copilot_profile_config

- name: Assert Copilot profile policy
  ansible.builtin.assert:
    that:
      - hermes_copilot_config.model.provider == 'copilot'
      - hermes_copilot_config.model.default == hermes_copilot_model
      - hermes_copilot_config.model.base_url == 'https://api.githubcopilot.com'
      - hermes_copilot_config.model.api_mode == 'codex_responses'
      - hermes_copilot_config.agent.reasoning_effort == 'max'
      - hermes_copilot_config.terminal.backend == 'ssh'
      - hermes_copilot_config.terminal.ssh_host == hermes_copilot_ssh_host
      - hermes_copilot_config.terminal.ssh_user == hermes_copilot_ssh_user
      - hermes_copilot_config.terminal.ssh_key == hermes_copilot_ssh_private_key_file
      - hermes_copilot_config.terminal.cwd == hermes_copilot_remote_cwd
      - hermes_copilot_config.terminal.enabled
      - hermes_copilot_config.terminal.ssh_host == hermes_virtuajimmy_ssh_host
      - hermes_copilot_config.terminal.cwd == hermes_virtuajimmy_remote_cwd
      - hermes_copilot_config.mcp_servers.keys() | list | sort == ['local_tools']
      - hermes_copilot_config.mcp_servers.local_tools.command == hermes_install_dir ~ '/venv/bin/python'
      - hermes_copilot_config.mcp_servers.local_tools.args == hermes_copilot_local_tools_args
      - hermes_copilot_config.mcp_servers.local_tools.env.keys() | list | sort == ['HERMES_HOME', 'HERMES_KANBAN_HOME', 'HERMES_PROFILE']
      - hermes_copilot_config.mcp_servers.local_tools.env.HERMES_HOME == hermes_copilot_profile_dir
      - hermes_copilot_config.mcp_servers.local_tools.env.HERMES_KANBAN_HOME == hermes_home
      - hermes_copilot_config.mcp_servers.local_tools.env.HERMES_PROFILE == 'copilot'
      - hermes_copilot_config.mcp_servers.local_tools.enabled
    fail_msg: "The Copilot profile does not enforce the managed Copilot provider and SSH policy."
    success_msg: "The Copilot profile enforces its Copilot provider and SSH terminal policy."
  vars:
    hermes_copilot_config: >-
      {{ hermes_copilot_profile_config.content | b64decode | from_yaml }}
    hermes_copilot_local_tools_args:
      - "{{ hermes_local_tools_bin }}"
      - --profile
      - copilot
      - --profile-root
      - "{{ hermes_copilot_profile_dir }}"
      - --runtime-host
      - "{{ inventory_hostname }}"
      - --terminal-host
      - "{{ hermes_copilot_ssh_host }}"
      - --terminal-cwd
      - "{{ hermes_copilot_remote_cwd }}"
      - --documents-json
      - "{{ hermes_copilot_local_documents | to_json }}"

- name: Inspect Copilot private files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_copilot_config_file }}"
    - "{{ hermes_copilot_soul_file }}"
    - "{{ hermes_copilot_baseline_file }}"
    - "{{ hermes_copilot_review_skill_file }}"
    - "{{ hermes_copilot_audit_skill_file }}"
    - "{{ hermes_copilot_env_file }}"
    - "{{ hermes_copilot_ssh_private_key_file }}"
  register: hermes_copilot_private_files
  no_log: true

- name: Assert secure Copilot private files
  ansible.builtin.assert:
    that:
      - item.stat.isreg
      - item.stat.pw_name == hermes_user
      - item.stat.gr_name == hermes_user
      - item.stat.mode == '0600'
  loop: "{{ hermes_copilot_private_files.results }}"
  no_log: true

- name: Read Copilot profile environment
  ansible.builtin.slurp:
    src: "{{ hermes_copilot_env_file }}"
  register: hermes_copilot_environment
  no_log: true

- name: Assert Copilot environment contents
  ansible.builtin.assert:
    that:
      - "'COPILOT_GITHUB_TOKEN=' in hermes_copilot_environment_text"
      - "('COPILOT_GITHUB_TOKEN=' + (hermes_copilot_github_token | trim)) in hermes_copilot_environment_text.splitlines()"
      - "'TERMINAL_ENV=ssh' in hermes_copilot_environment_text.splitlines()"
      - "('TERMINAL_SSH_HOST=' + hermes_copilot_ssh_host) in hermes_copilot_environment_text.splitlines()"
      - "('TERMINAL_SSH_USER=' + hermes_copilot_ssh_user) in hermes_copilot_environment_text.splitlines()"
      - "('TERMINAL_SSH_KEY=' + hermes_copilot_ssh_private_key_file) in hermes_copilot_environment_text.splitlines()"
      - "'DISCORD_BOT_TOKEN=' not in hermes_copilot_environment_text"
      - "'HERMES_DASHBOARD' not in hermes_copilot_environment_text"
    fail_msg: "The Copilot environment is missing required settings or exposes unrelated Hermes secrets."
    success_msg: "The Copilot environment carries the vaulted token and SSH settings only."
  vars:
    hermes_copilot_environment_text: >-
      {{ hermes_copilot_environment.content | b64decode }}
  no_log: true

- name: Find exact VirtuaJimmy SSH host trust
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -F
      - "{{ hermes_virtuajimmy_ssh_host }}"
      - -f
      - "{{ hermes_virtuajimmy_known_hosts_file }}"
  become: true
  become_user: "{{ hermes_user }}"
  register: hermes_virtuajimmy_known_host
  changed_when: false
  no_log: true

- name: Read exact VirtuaJimmy SSH host fingerprint
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -l
      - -f
      - '-'
      - -E
      - sha256
    stdin: "{{ hermes_virtuajimmy_known_host.stdout }}"
  become: true
  become_user: "{{ hermes_user }}"
  register: hermes_virtuajimmy_known_host_fingerprint
  changed_when: false

- name: Assert exact VirtuaJimmy SSH host trust
  ansible.builtin.assert:
    that:
      - hermes_virtuajimmy_known_host.rc == 0
      - hermes_virtuajimmy_ssh_host_fingerprint in hermes_virtuajimmy_known_host_fingerprint.stdout
    fail_msg: "The exact VirtuaJimmy SSH host is not pinned to the expected ED25519 fingerprint."
    success_msg: "The exact VirtuaJimmy SSH host is pinned to the expected ED25519 fingerprint."

- name: Verify strict VirtuaJimmy SSH access to the managed repository
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - IdentitiesOnly=yes
      - -i
      - "{{ hermes_virtuajimmy_ssh_private_key_file }}"
      - "{{ hermes_virtuajimmy_ssh_user }}@{{ hermes_virtuajimmy_ssh_host }}"
      - >-
        test -r {{ hermes_virtuajimmy_remote_cwd | quote }} &&
        printf '%s\n' {{ (hermes_virtuajimmy_remote_cwd ~ '-readable') | quote }}
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    HOME: "{{ hermes_user_home }}"
  register: hermes_virtuajimmy_strict_ssh
  changed_when: false

- name: Assert strict VirtuaJimmy SSH repository access
  ansible.builtin.assert:
    that:
      - hermes_virtuajimmy_strict_ssh.rc == 0
      - hermes_virtuajimmy_strict_ssh.stdout == hermes_virtuajimmy_remote_cwd ~ '-readable'
    fail_msg: "VirtuaJimmy strict SSH access cannot read the managed repository."
    success_msg: "VirtuaJimmy strict SSH access can read the managed repository."

- name: Read deployed VirtuaJimmy profile config
  ansible.builtin.slurp:
    src: "{{ hermes_virtuajimmy_config_file }}"
  register: hermes_virtuajimmy_profile_config

- name: Assert VirtuaJimmy profile policy
  ansible.builtin.assert:
    that:
      - hermes_virtuajimmy_config.terminal.backend == 'ssh'
      - hermes_virtuajimmy_config.terminal.ssh_host == hermes_virtuajimmy_ssh_host
      - hermes_virtuajimmy_config.terminal.ssh_user == hermes_virtuajimmy_ssh_user
      - hermes_virtuajimmy_config.terminal.cwd == hermes_virtuajimmy_remote_cwd
      - "'browser' not in hermes_virtuajimmy_config.agent.disabled_toolsets"
      - "'search' not in hermes_virtuajimmy_config.agent.disabled_toolsets"
      - hermes_virtuajimmy_config.browser.enabled
      - hermes_virtuajimmy_config.browser.cloud_provider == 'firecrawl'
      - not hermes_virtuajimmy_config.browser.use_gateway
      - hermes_virtuajimmy_config.browser.inactivity_timeout == 120
      - hermes_virtuajimmy_config.web.search_backend == 'firecrawl'
      - hermes_virtuajimmy_config.web.extract_backend == 'firecrawl'
      - hermes_virtuajimmy_config.onboarding.seen.busy_input_prompt
      - "'skills' not in hermes_virtuajimmy_config.agent.disabled_toolsets"
      - hermes_virtuajimmy_config.skills.disabled == []
      - "'delegation' in hermes_virtuajimmy_config.agent.disabled_toolsets"
      - hermes_virtuajimmy_config.approvals.mode == 'manual'
      - hermes_virtuajimmy_config.approvals.cron_mode == 'deny'
      - hermes_virtuajimmy_config.approvals.mcp_reload_confirm
      - hermes_virtuajimmy_config.approvals.destructive_slash_confirm
      - hermes_virtuajimmy_config.approvals.deny == ['git push *--force*', 'git push *-f*', '*curl*|*sh*', '*wget*|*sh*', '*> /dev/*']
      - hermes_virtuajimmy_config.security.tirith_enabled
      - not hermes_virtuajimmy_config.security.tirith_fail_open
      - hermes_virtuajimmy_config.display.file_mutation_verifier
      - hermes_virtuajimmy_config.tool_loop_guardrails.hard_stop_enabled
      - hermes_virtuajimmy_config.discord.enabled
      - hermes_virtuajimmy_config.discord.require_mention
      - not hermes_virtuajimmy_config.discord.allow_mentions.everyone
      - not hermes_virtuajimmy_config.discord.allow_mentions.roles
      - hermes_virtuajimmy_config.discord.max_attachment_bytes == 26214400
      - hermes_virtuajimmy_config.discord.free_response_channels == [hermes_virtuajimmy_discord_control_channel_id | string]
      - hermes_virtuajimmy_config.discord.allow_from == [hermes_virtuajimmy_discord_user_id | string]
      - hermes_virtuajimmy_config.toolsets == ['kanban']
      - hermes_virtuajimmy_config.platform_toolsets.keys() | list | sort == ['discord']
      - hermes_virtuajimmy_config.platform_toolsets.discord == ['hermes-discord', 'kanban']
      - "'kanban' not in hermes_virtuajimmy_config.agent.disabled_toolsets"
      - hermes_virtuajimmy_config.mcp_servers.keys() | list | sort == ['context7', 'grafana', 'local_tools', 'radarr', 'sonarr', 'tracearr']
      - hermes_virtuajimmy_config.mcp_servers.grafana.args == ['--enabled-tools', 'datasource,prometheus,loki', '--disable-write', '--disable-proxied']
      - hermes_virtuajimmy_config.mcp_servers.local_tools.command == hermes_install_dir ~ '/venv/bin/python'
      - hermes_virtuajimmy_config.mcp_servers.local_tools.args == hermes_virtuajimmy_local_tools_args
      - hermes_virtuajimmy_config.mcp_servers.local_tools.env.keys() | list | sort == ['HERMES_HOME', 'HERMES_KANBAN_HOME', 'HERMES_PROFILE']
      - hermes_virtuajimmy_config.mcp_servers.local_tools.env.HERMES_HOME == hermes_virtuajimmy_profile_dir
      - hermes_virtuajimmy_config.mcp_servers.local_tools.env.HERMES_KANBAN_HOME == hermes_home
      - hermes_virtuajimmy_config.mcp_servers.local_tools.env.HERMES_PROFILE == 'virtuajimmy'
      - hermes_virtuajimmy_config.mcp_servers.local_tools.enabled
    fail_msg: "The VirtuaJimmy profile does not enforce the managed capability policy."
    success_msg: "The VirtuaJimmy profile enforces its SSH, Discord, MCP, and security policy."
  vars:
    hermes_virtuajimmy_config: >-
      {{ hermes_virtuajimmy_profile_config.content | b64decode | from_yaml }}
    hermes_virtuajimmy_local_tools_args:
      - "{{ hermes_local_tools_bin }}"
      - --profile
      - virtuajimmy
      - --profile-root
      - "{{ hermes_virtuajimmy_profile_dir }}"
      - --runtime-host
      - "{{ inventory_hostname }}"
      - --terminal-host
      - "{{ hermes_virtuajimmy_ssh_host }}"
      - --terminal-cwd
      - "{{ hermes_virtuajimmy_remote_cwd }}"
      - --documents-json
      - "{{ hermes_virtuajimmy_local_documents | to_json }}"

- name: Inspect VirtuaJimmy private files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_virtuajimmy_config_file }}"
    - "{{ hermes_virtuajimmy_soul_file }}"
    - "{{ hermes_virtuajimmy_env_file }}"
    - "{{ hermes_virtuajimmy_ssh_private_key_file }}"
    - "{{ hermes_virtuajimmy_grafana_token_file }}"
    - "{{ hermes_virtuajimmy_pii_skill_file }}"
  register: hermes_virtuajimmy_private_files
  no_log: true

- name: Assert secure VirtuaJimmy private files
  ansible.builtin.assert:
    that:
      - item.stat.isreg
      - item.stat.pw_name == hermes_user
      - item.stat.gr_name == hermes_user
      - item.stat.mode == '0600'
  loop: "{{ hermes_virtuajimmy_private_files.results }}"
  no_log: true

- name: Inspect profile-local MCP server and obsolete helper
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_local_tools_bin }}"
    - "{{ hermes_bin_dir }}/hermes-vj-intake"
  register: hermes_local_tools_files

- name: Assert profile-local MCP server deployment
  ansible.builtin.assert:
    that:
      - hermes_local_tools_files.results[0].stat.isreg
      - hermes_local_tools_files.results[0].stat.pw_name == hermes_user
      - hermes_local_tools_files.results[0].stat.gr_name == hermes_user
      - hermes_local_tools_files.results[0].stat.mode == '0755'
      - not hermes_local_tools_files.results[1].stat.exists
    fail_msg: "The profile-local MCP server deployment does not match the managed file policy."
    success_msg: "The profile-local MCP server is executable and the obsolete intake helper is absent."

- name: Read VirtuaJimmy profile environment
  ansible.builtin.slurp:
    src: "{{ hermes_virtuajimmy_env_file }}"
  register: hermes_virtuajimmy_environment
  no_log: true

- name: Assert VirtuaJimmy environment isolation
  ansible.builtin.assert:
    that:
      - "'DISCORD_BOT_TOKEN=' in hermes_virtuajimmy_environment_text"
      - "'TERMINAL_SSH_HOST=' in hermes_virtuajimmy_environment_text"
      - "('HERMES_KANBAN_HOME=' ~ hermes_home) in hermes_virtuajimmy_environment_text.splitlines()"
      - "'HERMES_KANBAN_BOARD=homelab' in hermes_virtuajimmy_environment_text.splitlines()"
      - "('FIRECRAWL_API_URL=' ~ internal_firecrawl_url) in hermes_virtuajimmy_environment_text.splitlines()"
      - "'HOME_ASSISTANT_TOKEN=' not in hermes_virtuajimmy_environment_text"
      - "'HERMES_DASHBOARD' not in hermes_virtuajimmy_environment_text"
    fail_msg: "The VirtuaJimmy environment is missing required settings or exposes root profile secrets."
    success_msg: "The VirtuaJimmy environment is isolated from unrelated Hermes secrets."
  vars:
    hermes_virtuajimmy_environment_text: >-
      {{ hermes_virtuajimmy_environment.content | b64decode }}
  no_log: true

- name: Deploy Hermes environment secrets
  ansible.builtin.template:
    src: hermes.env.j2
    dest: "{{ hermes_env_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  no_log: true
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Link HASS profile to Hermes environment secrets
  ansible.builtin.file:
    src: "{{ hermes_env_file }}"
    dest: "{{ hermes_profiles_dir }}/hass/.env"
    state: link
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    force: true

- name: Inspect HASS profile environment link
  ansible.builtin.stat:
    path: "{{ hermes_profiles_dir }}/hass/.env"
    follow: false
  register: hermes_hass_env_link

- name: Inspect HASS profile environment target
  ansible.builtin.stat:
    path: "{{ hermes_profiles_dir }}/hass/.env"
    follow: true
  register: hermes_hass_env_target
  no_log: true

- name: Assert secure HASS profile environment access
  ansible.builtin.assert:
    that:
      - hermes_hass_env_link.stat.islnk
      - hermes_hass_env_link.stat.lnk_source == hermes_env_file
      - hermes_hass_env_target.stat.isreg
      - hermes_hass_env_target.stat.pw_name == hermes_user
      - hermes_hass_env_target.stat.gr_name == hermes_user
      - hermes_hass_env_target.stat.mode == '0600'
    fail_msg: >-
      The HASS profile must link to the root Hermes environment file,
      owned by {{ hermes_user }} at mode 0600.
    success_msg: "The HASS profile securely shares the root Hermes environment."
  no_log: true

- name: Deploy Hermes provider credential store
  ansible.builtin.template:
    src: auth.json.j2
    dest: "{{ hermes_auth_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
    validate: "{{ hermes_install_dir }}/venv/bin/python -m json.tool %s"
  no_log: true
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Inspect Hermes configuration paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_config_file }}"
    - "{{ hermes_legacy_config_file }}"
  register: hermes_config_paths

- name: Assert authoritative Hermes configuration path
  ansible.builtin.assert:
    that:
      - hermes_config_paths.results[0].stat.exists
      - hermes_config_paths.results[0].stat.isreg
      - hermes_config_paths.results[0].stat.pw_name == hermes_user
      - hermes_config_paths.results[0].stat.gr_name == hermes_user
      - hermes_config_paths.results[0].stat.mode == '0600'
      - not hermes_config_paths.results[1].stat.exists
    fail_msg: >-
      Hermes requires {{ hermes_config_file }} at mode 0600 and does not read
      {{ hermes_legacy_config_file }}.
    success_msg: "Hermes is using the authoritative config.yaml path."

- name: Deploy managed Hermes custom skills
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: >-
      {{ hermes_skills_dir }}/{{ item.category | default('custom', true) }}/{{ item.name }}/
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: preserve
    directory_mode: '0700'
  loop: "{{ hermes_custom_skills }}"
  when: hermes_custom_skills | length > 0
  notify:
    - Restart Hermes dashboard
    - Restart Hermes gateway

- name: Allow Hermes service ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop:
    - "{{ hermes_port }}"
    - "{{ hermes_api_server_port }}"
  when: ansible_os_family == "Debian"

- name: Read UFW status for Hermes services
  ansible.builtin.command:
    argv:
      - ufw
      - status
  register: hermes_ufw_status
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Assert Hermes dashboard UFW rule is active
  ansible.builtin.assert:
    that:
      - "'Status: active' in hermes_ufw_status.stdout"
      - "(hermes_port | string) + '/tcp' in hermes_ufw_status.stdout"
      - "(hermes_api_server_port | string) + '/tcp' in hermes_ufw_status.stdout"
    fail_msg: >-
      UFW is not active with TCP ports {{ hermes_port }} and
      {{ hermes_api_server_port }} allowed.
    success_msg: >-
      UFW is active with TCP ports {{ hermes_port }} and
      {{ hermes_api_server_port }} allowed.
  when:
    - ansible_os_family == "Debian"
    - not ansible_check_mode

- name: Deploy Hermes dashboard service source
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: "{{ hermes_service_source_path }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes dashboard

- name: Deploy Hermes dashboard systemd unit
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: "{{ hermes_service_unit_path }}"
    owner: root
    group: root
    mode: '0600'
  notify:
    - Reload Hermes system systemd
    - Restart Hermes dashboard

- name: Deploy Hermes gateway service source
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "{{ hermes_gateway_service_source_path }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes gateway

- name: Deploy Hermes gateway systemd unit
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "{{ hermes_gateway_service_unit_path }}"
    owner: root
    group: root
    mode: '0600'
  notify:
    - Reload Hermes system systemd
    - Restart Hermes gateway

- name: Deploy Hermes Plexibot gateway user unit
  ansible.builtin.template:
    src: hermes-gateway-plexibot.service.j2
    dest: "{{ hermes_plexibot_gateway_service_unit_path }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'
  notify:
    - Reload Hermes user systemd
    - Restart Hermes Plexibot gateway

- name: Deploy Hermes VirtuaJimmy gateway user unit
  ansible.builtin.template:
    src: hermes-gateway-virtuajimmy.service.j2
    dest: "{{ hermes_virtuajimmy_gateway_service_unit_path }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'
  notify:
    - Reload Hermes user systemd
    - Restart Hermes VirtuaJimmy gateway

- name: Apply pending Hermes restart
  ansible.builtin.meta: flush_handlers

- name: Enable and start Hermes dashboard
  ansible.builtin.systemd_service:
    name: "{{ hermes_service_name }}"
    state: started
    enabled: true

- name: Enable and start Hermes gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_gateway_service_name }}"
    state: started
    enabled: true

- name: Enable and start Hermes Plexibot gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_plexibot_gateway_service_name }}"
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus

- name: Enable and start Hermes VirtuaJimmy gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_virtuajimmy_gateway_service_name }}"
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus

- name: Read Hermes dashboard service status
  ansible.builtin.systemd_service:
    name: "{{ hermes_service_name }}"
  register: hermes_service_status

- name: Read Hermes gateway service status
  ansible.builtin.systemd_service:
    name: "{{ hermes_gateway_service_name }}"
  register: hermes_gateway_service_status

- name: Read Hermes Plexibot gateway service status
  ansible.builtin.systemd_service:
    name: "{{ hermes_plexibot_gateway_service_name }}"
    scope: user
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus
  register: hermes_plexibot_gateway_service_status

- name: Read Hermes VirtuaJimmy gateway service status
  ansible.builtin.systemd_service:
    name: "{{ hermes_virtuajimmy_gateway_service_name }}"
    scope: user
  become: true
  become_user: "{{ hermes_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts.getent_passwd[hermes_user][1] }}/bus
  register: hermes_virtuajimmy_gateway_service_status

- name: Read Hermes VirtuaJimmy gateway unit
  ansible.builtin.slurp:
    src: "{{ hermes_virtuajimmy_gateway_service_unit_path }}"
  register: hermes_virtuajimmy_gateway_unit

- name: Assert Hermes dashboard service state
  ansible.builtin.assert:
    that:
      - hermes_service_status.status.ActiveState == 'active'
      - hermes_service_status.status.UnitFileState == 'enabled'
      - hermes_service_status.status.FragmentPath == hermes_service_unit_path
      - hermes_service_status.status.MainPID | int > 0
    fail_msg: "Hermes dashboard is not active and enabled from the managed unit."
    success_msg: "Hermes dashboard is active and enabled at boot."

- name: Assert Hermes gateway service state
  ansible.builtin.assert:
    that:
      - hermes_gateway_service_status.status.ActiveState == 'active'
      - hermes_gateway_service_status.status.UnitFileState == 'enabled'
      - hermes_gateway_service_status.status.FragmentPath == hermes_gateway_service_unit_path
      - hermes_gateway_service_status.status.MainPID | int > 0
    fail_msg: "Hermes gateway is not active and enabled from the managed unit."
    success_msg: "Hermes gateway is active and enabled at boot."

- name: Assert Hermes Plexibot gateway service state
  ansible.builtin.assert:
    that:
      - hermes_plexibot_gateway_service_status.status.ActiveState == 'active'
      - hermes_plexibot_gateway_service_status.status.UnitFileState == 'enabled'
      - >-
        hermes_plexibot_gateway_service_status.status.FragmentPath ==
        hermes_plexibot_gateway_service_unit_path
      - hermes_plexibot_gateway_service_status.status.MainPID | int > 0
    fail_msg: >-
      Hermes Plexibot gateway is not active and enabled from the managed user unit.
    success_msg: "Hermes Plexibot gateway is active and enabled at boot."

- name: Assert Hermes VirtuaJimmy gateway service state
  ansible.builtin.assert:
    that:
      - hermes_virtuajimmy_gateway_service_status.status.ActiveState == 'active'
      - hermes_virtuajimmy_gateway_service_status.status.UnitFileState == 'enabled'
      - >-
        hermes_virtuajimmy_gateway_service_status.status.FragmentPath ==
        hermes_virtuajimmy_gateway_service_unit_path
      - hermes_virtuajimmy_gateway_service_status.status.MainPID | int > 0
      - "'--profile virtuajimmy gateway run' in hermes_virtuajimmy_gateway_unit_text"
      - "('WorkingDirectory=' + hermes_virtuajimmy_profile_dir) in hermes_virtuajimmy_gateway_unit_text"
      - "('HERMES_HOME=' + hermes_virtuajimmy_profile_dir) in hermes_virtuajimmy_gateway_unit_text"
    fail_msg: >-
      Hermes VirtuaJimmy gateway is not active and enabled from the managed user unit.
    success_msg: "Hermes VirtuaJimmy gateway is active and enabled at boot."
  vars:
    hermes_virtuajimmy_gateway_unit_text: >-
      {{ hermes_virtuajimmy_gateway_unit.content | b64decode }}

- name: Read Hermes Plexibot gateway process identity
  ansible.builtin.command:
    argv:
      - ps
      - -p
      - "{{ hermes_plexibot_gateway_service_status.status.MainPID }}"
      - -o
      - user=
      - -o
      - args=
  register: hermes_plexibot_gateway_process
  changed_when: false
  when: not ansible_check_mode

- name: Assert Hermes Plexibot gateway process identity
  ansible.builtin.assert:
    that:
      - >-
        hermes_plexibot_gateway_process.stdout is match(
          '^' + hermes_user + '\\s+'
        )
      - "'--profile plexibot gateway run' in hermes_plexibot_gateway_process.stdout"
    fail_msg: >-
      Hermes Plexibot gateway is not running as {{ hermes_user }} with the
      plexibot profile.
    success_msg: >-
      Hermes Plexibot gateway is running as {{ hermes_user }} with the
      plexibot profile.
  when: not ansible_check_mode

- name: Read Hermes VirtuaJimmy gateway process identity
  ansible.builtin.command:
    argv:
      - ps
      - -p
      - "{{ hermes_virtuajimmy_gateway_service_status.status.MainPID }}"
      - -o
      - user=
      - -o
      - args=
  register: hermes_virtuajimmy_gateway_process
  changed_when: false
  when: not ansible_check_mode

- name: Assert Hermes VirtuaJimmy gateway process identity
  ansible.builtin.assert:
    that:
      - >-
        hermes_virtuajimmy_gateway_process.stdout is match(
          '^' + hermes_user + '\\s+'
        )
      - >-
        '--profile virtuajimmy gateway run' in
        hermes_virtuajimmy_gateway_process.stdout
    fail_msg: >-
      Hermes VirtuaJimmy gateway is not running as {{ hermes_user }} with the
      virtuajimmy profile.
    success_msg: >-
      Hermes VirtuaJimmy gateway is running as {{ hermes_user }} with the
      virtuajimmy profile.
  when: not ansible_check_mode

- name: Wait for Hermes dashboard listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ hermes_port }}"
    state: started
    timeout: 120

- name: Wait for Hermes API server listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ hermes_api_server_port }}"
    state: started
    timeout: 120

- name: Gather listening port facts
  community.general.listen_ports_facts:

- name: Select Hermes dashboard listeners
  ansible.builtin.set_fact:
    hermes_dashboard_listeners: >-
      {{ ansible_facts.tcp_listen
         | selectattr('port', 'equalto', hermes_port | int)
         | list }}

- name: Select Hermes API server listeners
  ansible.builtin.set_fact:
    hermes_api_server_listeners: >-
      {{ ansible_facts.tcp_listen
         | selectattr('port', 'equalto', hermes_api_server_port | int)
         | list }}

- name: Assert Hermes dashboard listener identity
  ansible.builtin.assert:
    that:
      - hermes_dashboard_listeners | length > 0
      - hermes_bind_address in (hermes_dashboard_listeners | map(attribute='address') | list)
      - hermes_user in (hermes_dashboard_listeners | map(attribute='user') | list)
      - hermes_dashboard_process_name in (hermes_dashboard_listeners | map(attribute='name') | list)
      - (hermes_service_status.status.MainPID | int) in (hermes_dashboard_listeners | map(attribute='pid') | list)
    fail_msg: >-
      Hermes dashboard is not listening as {{ hermes_user }} process
      {{ hermes_dashboard_process_name }} on {{ hermes_bind_address }}:{{ hermes_port }}.
    success_msg: >-
      Hermes dashboard is listening as {{ hermes_user }} process
      {{ hermes_dashboard_process_name }} on {{ hermes_bind_address }}:{{ hermes_port }}.

- name: Assert Hermes API server listener identity
  ansible.builtin.assert:
    that:
      - hermes_api_server_listeners | length > 0
      - hermes_api_server_bind_address in (hermes_api_server_listeners | map(attribute='address') | list)
      - hermes_user in (hermes_api_server_listeners | map(attribute='user') | list)
      - hermes_gateway_process_name in (hermes_api_server_listeners | map(attribute='name') | list)
      - (hermes_gateway_service_status.status.MainPID | int) in (hermes_api_server_listeners | map(attribute='pid') | list)
    fail_msg: >-
      Hermes API server is not listening as {{ hermes_user }} process
      {{ hermes_gateway_process_name }} on
      {{ hermes_api_server_bind_address }}:{{ hermes_api_server_port }}.
    success_msg: >-
      Hermes API server is listening as {{ hermes_user }} process
      {{ hermes_gateway_process_name }} on
      {{ hermes_api_server_bind_address }}:{{ hermes_api_server_port }}.

- name: Read Hermes dashboard public status
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/api/status"
    method: GET
    return_content: true
    status_code: 200
  register: hermes_dashboard_status
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Assert Hermes dashboard authentication gate
  ansible.builtin.assert:
    that:
      - hermes_dashboard_status.json.auth_required | bool
      - hermes_dashboard_auth_provider in (hermes_dashboard_status.json.auth_providers | default([]))
    fail_msg: "Hermes dashboard authentication is not active."
    success_msg: "Hermes dashboard authentication is active."
  when: not ansible_check_mode

- name: Verify unauthenticated Hermes dashboard redirect
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/"
    method: GET
    follow_redirects: none
    status_code: 302
  register: hermes_dashboard_unauthenticated
  changed_when: false
  when: not ansible_check_mode

- name: Assert unauthenticated Hermes dashboard requires login
  ansible.builtin.assert:
    that:
      - "'/login?next=' in hermes_dashboard_unauthenticated.location"
    fail_msg: "Hermes dashboard did not redirect an unauthenticated request to login."
    success_msg: "Hermes dashboard redirects unauthenticated requests to login."
  when: not ansible_check_mode

- name: Authenticate to Hermes dashboard
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/auth/password-login"
    method: POST
    body_format: json
    body:
      provider: "{{ hermes_dashboard_auth_provider }}"
      username: "{{ hermes_dashboard_basic_auth_username }}"
      password: "{{ hermes_dashboard_basic_auth_password }}"
      next: /
    return_content: true
    status_code: 200
  register: hermes_dashboard_login
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Verify authenticated Hermes dashboard identity
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/api/auth/me"
    method: GET
    headers:
      Cookie: "{{ hermes_dashboard_login.cookies_string }}"
    return_content: true
    status_code: 200
  register: hermes_dashboard_identity
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Assert authenticated Hermes dashboard identity
  ansible.builtin.assert:
    that:
      - hermes_dashboard_login.json.ok | bool
      - hermes_dashboard_login.json.next == '/'
      - hermes_dashboard_login.cookies_string | length > 0
      - hermes_dashboard_identity.json.provider == hermes_dashboard_auth_provider
      - hermes_dashboard_identity.json.user_id == hermes_dashboard_basic_auth_username
    fail_msg: "Hermes dashboard authentication did not return the expected identity."
    success_msg: "Hermes dashboard authentication returned the expected identity."
  no_log: true
  when: not ansible_check_mode

- name: Verify authenticated Hermes dashboard content
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/"
    method: GET
    headers:
      Cookie: "{{ hermes_dashboard_login.cookies_string }}"
    return_content: true
    status_code: 200
  register: hermes_dashboard_authenticated
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Assert authenticated Hermes dashboard content
  ansible.builtin.assert:
    that:
      - hermes_dashboard_expected_text in hermes_dashboard_authenticated.content
    fail_msg: "Authenticated port {{ hermes_port }} did not return the Hermes dashboard."
    success_msg: "Authenticated Hermes dashboard returned expected content."
  when: not ansible_check_mode

