---
# Research Notes - Hermes Agent
# Official repository: https://github.com/NousResearch/hermes-agent
# Documentation: https://hermes-agent.nousresearch.com/docs/
# Install docs: https://github.com/NousResearch/hermes-agent#quick-install
# Configuration: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
# Providers: https://hermes-agent.nousresearch.com/docs/integrations/providers
# Skills: https://hermes-agent.nousresearch.com/docs/user-guide/features/skills
# Security policy: https://github.com/NousResearch/hermes-agent/blob/main/SECURITY.md
# Release: https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.3
# Audited commit: https://github.com/NousResearch/hermes-agent/commit/b3aa561faffd64f05436e429a6415d175e534ec9
# Last researched: 2026-08-08
#
# Native user-scoped Git installation managed by the official installer. The
# dashboard defaults to 127.0.0.1:9119; this audited deployment intentionally
# binds to 0.0.0.0:9119 with dashboard authentication and UFW enabled. Upstream
# requires auth for non-loopback binds and recommends OS isolation, non-root
# execution, tight credential permissions, and review of third-party skills.
# GitHub listed no published project security advisories on the research date.

hermes_version: "0.20.0"
hermes_release: "2026.8.3"
hermes_release_commit: "b3aa561faffd64f05436e429a6415d175e534ec9"
hermes_install_commit: "b3aa561faffd64f05436e429a6415d175e534ec9"
hermes_installer_url: "https://raw.githubusercontent.com/NousResearch/hermes-agent/{{ hermes_install_commit }}/scripts/install.sh"
hermes_installer_checksum: "sha256:45f589461248c7a6ec3aecd7522a69dd49c5c8dbf4798ba1296af5c0c5e7ccd3"
hermes_installer_path: "/var/tmp/hermes-install-{{ hermes_install_commit }}.sh"
hermes_required_packages:
  - acl
  - build-essential
  - ca-certificates
  - curl
  - ffmpeg
  - git
  - libffi-dev
  - python3-dev
  - ripgrep

# Grafana MCP server: https://github.com/grafana/mcp-grafana/releases/tag/v1.3.0
hermes_mcp_grafana_version: "1.3.0"
hermes_mcp_grafana_archive_arch: >-
  {{ {'x86_64': 'x86_64', 'aarch64': 'arm64'}[ansible_architecture] }}
hermes_mcp_grafana_archive_url: >-
  https://github.com/grafana/mcp-grafana/releases/download/v{{ hermes_mcp_grafana_version }}/mcp-grafana_Linux_{{ hermes_mcp_grafana_archive_arch }}.tar.gz
hermes_mcp_grafana_archive_checksums:
  x86_64: b9fc66e0613a4def86253627cb71b094ca35cf213ab18fa09a8d8bd578c197b1
  aarch64: c70c3d15514f1351cb5fb3e81b7e80e19fab229dda30b7ac1bce3cc812f838ec
hermes_mcp_grafana_archive_checksum: >-
  sha256:{{ hermes_mcp_grafana_archive_checksums[ansible_architecture] }}
hermes_mcp_grafana_archive_path: >-
  /var/tmp/mcp-grafana-{{ hermes_mcp_grafana_version }}-linux-{{ hermes_mcp_grafana_archive_arch }}.tar.gz
hermes_mcp_grafana_install_dir: >-
  {{ hermes_mcp_grafana_install_root }}/{{ hermes_mcp_grafana_version }}

...
