---
- name: Reload Prometheus configuration
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/prometheus_reload.yaml"
  when:
    - grafana_prometheus_before.exists
    - grafana_prometheus_before.container.State.Running

- name: Start Grafana
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_parent_folder }}"
    state: restarted
    remove_orphans: true

- name: Restart Homepage
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_folder }}"
    state: restarted
  delegate_to: "{{ groups['homepage_host'][0] }}"

- name: Restart Swag Internal
  become: false
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_folder }}"
    services:
      - swag_internal
    state: restarted
  delegate_to: "{{ groups['proxy_host'][0] }}"
