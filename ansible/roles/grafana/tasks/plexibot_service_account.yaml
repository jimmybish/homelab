---
# Provision a dedicated Grafana OSS Viewer service account for Hermes
# Plexibot. The existing Copilot Admin token is the management credential for
# every identity and token lifecycle operation. The Viewer token is never used
# against an admin-only endpoint except for explicit least-privilege probes.

- name: Set direct Grafana API URL for Plexibot identity provisioning
  ansible.builtin.set_fact:
    _plexibot_grafana_base: >-
      http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ grafana_port }}

- name: Wait for Grafana API before Plexibot identity provisioning
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/health"
    method: GET
    status_code: 200
  register: _plexibot_grafana_health
  retries: 30
  delay: 2
  until: _plexibot_grafana_health.status == 200
  delegate_to: localhost
  become: false

- name: Validate the management credential on an admin-only endpoint
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/serviceaccounts/search?perpage=1&page=1"
    method: GET
    headers:
      Authorization: "Bearer {{ grafana_api_token }}"
    status_code: [200, 401, 403]
  register: _plexibot_management_check
  failed_when: false
  no_log: true
  delegate_to: localhost
  become: false

- name: Require the existing Copilot Admin management credential
  ansible.builtin.assert:
    that:
      - _plexibot_management_check.status == 200
    fail_msg: >-
      The existing Grafana management credential cannot manage service
      accounts; refusing to create or rotate the Hermes Plexibot token.

- name: Set management authorization header
  ansible.builtin.set_fact:
    _plexibot_management_headers:
      Authorization: "Bearer {{ grafana_api_token }}"
  no_log: true

- name: Search for the Hermes Plexibot service account with management auth
  ansible.builtin.uri:
    url: >-
      {{ _plexibot_grafana_base }}/api/serviceaccounts/search?perpage=1000&page=1&query={{ grafana_plexibot_service_account_name | urlencode }}
    method: GET
    headers: "{{ _plexibot_management_headers }}"
    status_code: 200
  register: _plexibot_sa_search
  no_log: true
  delegate_to: localhost
  become: false

- name: Resolve exact Hermes Plexibot service-account matches
  ansible.builtin.set_fact:
    _plexibot_sa_matches: >-
      {{ _plexibot_sa_search.json.serviceAccounts | default([])
         | selectattr('name', 'equalto', grafana_plexibot_service_account_name)
         | list }}
  no_log: true

- name: Refuse ambiguous duplicate service accounts
  ansible.builtin.assert:
    that:
      - _plexibot_sa_matches | length <= 1
    fail_msg: >-
      Multiple exact Hermes Plexibot service accounts exist; refusing to mint
      another token until the duplicate identity is resolved.

- name: Create the Hermes Plexibot Viewer service account
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/serviceaccounts"
    method: POST
    headers: "{{ _plexibot_management_headers }}"
    body_format: json
    body:
      name: "{{ grafana_plexibot_service_account_name }}"
      role: "{{ grafana_plexibot_service_account_role }}"
      isDisabled: false
    status_code: [200, 201]
  register: _plexibot_sa_created
  when: _plexibot_sa_matches | length == 0
  changed_when: _plexibot_sa_created.status in [200, 201]
  no_log: true
  delegate_to: localhost
  become: false

- name: Resolve the Hermes Plexibot service account
  ansible.builtin.set_fact:
    _plexibot_sa: >-
      {{ (_plexibot_sa_matches | first)
         if (_plexibot_sa_matches | length == 1)
         else _plexibot_sa_created.json }}
    _plexibot_sa_was_created: "{{ _plexibot_sa_matches | length == 0 }}"
  no_log: true

- name: Require the service account to belong to Grafana organization 1
  ansible.builtin.assert:
    that:
      - _plexibot_sa.orgId | int == 1
    fail_msg: "Hermes Plexibot service account is not in Grafana organization 1."

- name: Enforce the Viewer basic role with management auth
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/serviceaccounts/{{ _plexibot_sa.id }}"
    method: PATCH
    headers: "{{ _plexibot_management_headers }}"
    body_format: json
    body:
      name: "{{ grafana_plexibot_service_account_name }}"
      role: "{{ grafana_plexibot_service_account_role }}"
    status_code: 200
  when: _plexibot_sa.role != grafana_plexibot_service_account_role
  no_log: true
  delegate_to: localhost
  become: false

- name: Validate the currently vaulted Plexibot token on a non-admin endpoint
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/user"
    method: GET
    headers:
      Authorization: "Bearer {{ hermes_plexibot_grafana_api_token | trim }}"
    status_code: [200, 401, 403]
  register: _plexibot_token_check
  failed_when: false
  no_log: true
  delegate_to: localhost
  become: false

- name: Determine whether the vaulted token belongs to the Viewer identity
  ansible.builtin.set_fact:
    _plexibot_token_valid: >-
      {{ (_plexibot_token_check.status == 200)
         and ((_plexibot_token_check.json.login | default('')) == (_plexibot_sa.login | default('')))
        and ((_plexibot_token_check.json.orgId | default(0) | int) == 1) }}
  no_log: true

- name: Normalize a valid vaulted Plexibot token without rotating it
  when:
    - _plexibot_token_valid
    - hermes_plexibot_grafana_api_token != (hermes_plexibot_grafana_api_token | trim)
  block:
    - name: Encrypt the normalized Plexibot token
      ansible.builtin.command:
        cmd: >-
          ansible-vault encrypt_string
          --vault-password-file {{ grafana_vault_password_file }}
          --stdin-name hermes_plexibot_grafana_api_token
        stdin: "{{ hermes_plexibot_grafana_api_token | trim }}"
        stdin_add_newline: false
      register: _plexibot_normalized_encrypted_token
      changed_when: true
      no_log: true
      delegate_to: localhost
      become: false

    - name: Persist the normalized encrypted Plexibot token
      ansible.builtin.replace:
        path: "{{ grafana_vault_vars_file }}"
        regexp: '(?m)^hermes_plexibot_grafana_api_token: !vault \|\n(?:[ ]+.*\n)+?(?=\n|\Z)'
        replace: "{{ _plexibot_normalized_encrypted_token.stdout }}\n"
      no_log: true
      delegate_to: localhost
      become: false

- name: List Plexibot tokens with the management credential
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/serviceaccounts/{{ _plexibot_sa.id }}/tokens"
    method: GET
    headers: "{{ _plexibot_management_headers }}"
    status_code: 200
  register: _plexibot_existing_tokens_response
  no_log: true
  delegate_to: localhost
  become: false

- name: Classify existing Plexibot tokens
  ansible.builtin.set_fact:
    _plexibot_existing_tokens: "{{ _plexibot_existing_tokens_response.json | default([]) }}"
    _plexibot_active_tokens: >-
      {{ _plexibot_existing_tokens_response.json | default([])
         | rejectattr('hasExpired', 'equalto', true) | list }}
    _plexibot_need_token: >-
      {{ (grafana_rotate_plexibot_token | bool) or (not _plexibot_token_valid) }}
  no_log: true

- name: Prevent accidental duplicate token minting
  ansible.builtin.assert:
    that:
      - >-
        _plexibot_token_valid
        or (grafana_rotate_plexibot_token | bool)
        or (_plexibot_sa_was_created | bool)
        or (_plexibot_active_tokens | length == 0)
    fail_msg: >-
      The vaulted Hermes Plexibot token is invalid, but Grafana already has an
      active token for this account. Token secrets are unrecoverable; refusing
      to mint a duplicate. Set grafana_rotate_plexibot_token=true only for an
      intentional rotation.
  when: _plexibot_need_token

- name: Mint and persist the dedicated Plexibot Viewer token
  when: _plexibot_need_token
  block:
    - name: Generate a unique Plexibot token name
      ansible.builtin.set_fact:
        _plexibot_new_token_name: >-
          {{ grafana_plexibot_service_account_token_name }} {{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}
      no_log: true

    - name: Mint the Plexibot token using management auth
      ansible.builtin.uri:
        url: "{{ _plexibot_grafana_base }}/api/serviceaccounts/{{ _plexibot_sa.id }}/tokens"
        method: POST
        headers: "{{ _plexibot_management_headers }}"
        body_format: json
        body:
          name: "{{ _plexibot_new_token_name }}"
        status_code: [200, 201]
      register: _plexibot_new_token_response
      changed_when: _plexibot_new_token_response.status in [200, 201]
      no_log: true
      delegate_to: localhost
      become: false

    - name: Capture the one-time Plexibot token secret
      ansible.builtin.set_fact:
        _plexibot_effective_token: "{{ _plexibot_new_token_response.json.key }}"
      no_log: true

    - name: Encrypt the Plexibot token from standard input
      ansible.builtin.command:
        cmd: >-
          ansible-vault encrypt_string
          --vault-password-file {{ grafana_vault_password_file }}
          --stdin-name hermes_plexibot_grafana_api_token
        stdin: "{{ _plexibot_effective_token }}"
        stdin_add_newline: false
      register: _plexibot_encrypted_token
      changed_when: true
      no_log: true
      delegate_to: localhost
      become: false

    - name: Persist the encrypted Plexibot token in group vars
      ansible.builtin.replace:
        path: "{{ grafana_vault_vars_file }}"
        regexp: '(?m)^hermes_plexibot_grafana_api_token: !vault \|\n(?:[ ]+.*\n)+?(?=\n|\Z)'
        replace: "{{ _plexibot_encrypted_token.stdout }}\n"
      register: _plexibot_token_persisted
      no_log: true
      delegate_to: localhost
      become: false

    - name: Require successful encrypted token persistence
      ansible.builtin.assert:
        that:
          - _plexibot_token_persisted.changed
        fail_msg: >-
          The new Plexibot token was minted but could not be persisted in the
          encrypted group variable; manual recovery is required before retrying.
      no_log: true

    - name: Remove superseded Plexibot tokens using management auth
      ansible.builtin.uri:
        url: >-
          {{ _plexibot_grafana_base }}/api/serviceaccounts/{{ _plexibot_sa.id }}/tokens/{{ item.id }}
        method: DELETE
        headers: "{{ _plexibot_management_headers }}"
        status_code: 200
      loop: "{{ _plexibot_existing_tokens }}"
      loop_control:
        label: "redacted token id"
      no_log: true
      delegate_to: localhost
      become: false

- name: Use the existing vaulted Plexibot token when no token was minted
  ansible.builtin.set_fact:
    _plexibot_effective_token: "{{ hermes_plexibot_grafana_api_token | trim }}"
  when: not _plexibot_need_token
  no_log: true

- name: Re-read the Plexibot account with management auth
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/serviceaccounts/{{ _plexibot_sa.id }}"
    method: GET
    headers: "{{ _plexibot_management_headers }}"
    status_code: 200
  register: _plexibot_account_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Validate Plexibot token authentication and identity
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/user"
    method: GET
    headers:
      Authorization: "Bearer {{ _plexibot_effective_token }}"
    status_code: 200
  register: _plexibot_auth_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Validate Plexibot datasource read permission
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/datasources"
    method: GET
    headers:
      Authorization: "Bearer {{ _plexibot_effective_token }}"
    status_code: 200
  register: _plexibot_datasource_read_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Validate Plexibot datasource query permission
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/ds/query"
    method: POST
    headers:
      Authorization: "Bearer {{ _plexibot_effective_token }}"
    body_format: json
    status_code: 200
    body:
      from: "now-5m"
      to: "now"
      queries:
        - refId: "A"
          datasource:
            uid: "{{ grafana_prometheus_uid }}"
          expr: "vector(1)"
          format: "time_series"
          instant: true
          range: false
  register: _plexibot_datasource_query_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Verify Plexibot cannot mutate datasources
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/datasources/uid/__plexibot_permission_probe__"
    method: PUT
    headers:
      Authorization: "Bearer {{ _plexibot_effective_token }}"
    body_format: json
    body:
      name: "permission-probe"
      type: "prometheus"
      url: "http://127.0.0.1"
      access: "proxy"
    status_code: 403
  register: _plexibot_mutation_denied_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Verify Plexibot cannot use organization admin APIs
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/org/users"
    method: GET
    headers:
      Authorization: "Bearer {{ _plexibot_effective_token }}"
    status_code: 403
  register: _plexibot_admin_denied_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Verify Plexibot cannot manage service accounts
  ansible.builtin.uri:
    url: "{{ _plexibot_grafana_base }}/api/serviceaccounts/search?perpage=1&page=1"
    method: GET
    headers:
      Authorization: "Bearer {{ _plexibot_effective_token }}"
    status_code: 403
  register: _plexibot_service_accounts_denied_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Build redacted Plexibot permission validation summary
  ansible.builtin.set_fact:
    _plexibot_validation_summary:
      account_exists_org_1: >-
        {{ (_plexibot_account_validation.status == 200)
           and ((_plexibot_account_validation.json.orgId | int) == 1) }}
      account_role_viewer: >-
        {{ (_plexibot_account_validation.json.role | default('')) == 'Viewer' }}
      token_authenticates: "{{ _plexibot_auth_validation.status == 200 }}"
      token_identity_matches: >-
        {{ (_plexibot_auth_validation.json.login | default(''))
           == (_plexibot_account_validation.json.login | default('')) }}
      datasource_read_allowed: "{{ _plexibot_datasource_read_validation.status == 200 }}"
      datasource_query_allowed: "{{ _plexibot_datasource_query_validation.status == 200 }}"
      datasource_mutation_denied: "{{ _plexibot_mutation_denied_validation.status == 403 }}"
      organization_admin_denied: "{{ _plexibot_admin_denied_validation.status == 403 }}"
      service_account_management_denied: >-
        {{ _plexibot_service_accounts_denied_validation.status == 403 }}
  no_log: true

- name: Report redacted Plexibot permission validation
  ansible.builtin.debug:
    var: _plexibot_validation_summary

- name: Require all Plexibot least-privilege checks to pass
  ansible.builtin.assert:
    that:
      - _plexibot_validation_summary.values() | select('equalto', false) | list | length == 0
    success_msg: "All redacted Hermes Plexibot Viewer permission checks passed."
    fail_msg: "One or more redacted Hermes Plexibot Viewer permission checks failed."
