---
# Provision a dedicated Grafana OSS Viewer service account for the Tronbyt
# "vLLM is thinking" poller. Same identity model as the Hermes Plexibot
# account: the Copilot Admin token (grafana_api_token) is the management
# credential for every lifecycle operation, and the Viewer token is only ever
# used for read queries plus explicit least-privilege probes.
#
# The poller needs exactly one capability: POST/GET to /api/v1/query (or
# /api/ds/query) against the Prometheus datasource. Everything else must be
# denied, which the probes at the bottom of this file assert.

- name: Set direct Grafana API URL for thinking-poller identity provisioning
  ansible.builtin.set_fact:
    grafana_thinking_grafana_base: >-
      http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ grafana_port }}

- name: Wait for Grafana API before thinking-poller identity provisioning
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/health"
    method: GET
    status_code: 200
  register: grafana_thinking_grafana_health
  retries: 30
  delay: 2
  until: grafana_thinking_grafana_health.status == 200
  delegate_to: localhost
  become: false

- name: Validate the management credential for thinking-poller provisioning
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/serviceaccounts/search?perpage=1&page=1"
    method: GET
    headers:
      Authorization: "Bearer {{ grafana_api_token }}"
    status_code: [200, 401, 403]
  register: grafana_thinking_management_check
  failed_when: false
  no_log: true
  delegate_to: localhost
  become: false

- name: Require the existing Copilot Admin management credential
  ansible.builtin.assert:
    that:
      - grafana_thinking_management_check.status == 200
    fail_msg: >-
      The existing Grafana management credential cannot manage service
      accounts; refusing to create or rotate the Tronbyt thinking token.

- name: Set thinking-poller management authorization header
  ansible.builtin.set_fact:
    grafana_thinking_management_headers:
      Authorization: "Bearer {{ grafana_api_token }}"
  no_log: true

- name: Search for the Tronbyt thinking service account
  ansible.builtin.uri:
    url: >-
      {{ grafana_thinking_grafana_base }}/api/serviceaccounts/search?perpage=1000&page=1&query={{ grafana_thinking_service_account_name | urlencode }}
    method: GET
    headers: "{{ grafana_thinking_management_headers }}"
    status_code: 200
  register: grafana_thinking_sa_search
  no_log: true
  delegate_to: localhost
  become: false

- name: Resolve exact Tronbyt thinking service-account matches
  ansible.builtin.set_fact:
    grafana_thinking_sa_matches: >-
      {{ grafana_thinking_sa_search.json.serviceAccounts | default([])
         | selectattr('name', 'equalto', grafana_thinking_service_account_name)
         | list }}
  no_log: true

- name: Refuse ambiguous duplicate thinking-poller service accounts
  ansible.builtin.assert:
    that:
      - grafana_thinking_sa_matches | length <= 1
    fail_msg: >-
      Multiple exact Tronbyt thinking service accounts exist; refusing to mint
      another token until the duplicate identity is resolved.

- name: Create the Tronbyt thinking Viewer service account
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/serviceaccounts"
    method: POST
    headers: "{{ grafana_thinking_management_headers }}"
    body_format: json
    body:
      name: "{{ grafana_thinking_service_account_name }}"
      role: "{{ grafana_thinking_service_account_role }}"
      isDisabled: false
    status_code: [200, 201]
  register: grafana_thinking_sa_created
  when: grafana_thinking_sa_matches | length == 0
  changed_when: grafana_thinking_sa_created.status in [200, 201]
  no_log: true
  delegate_to: localhost
  become: false

- name: Resolve the Tronbyt thinking service account
  ansible.builtin.set_fact:
    grafana_thinking_sa: >-
      {{ (grafana_thinking_sa_matches | first)
         if (grafana_thinking_sa_matches | length == 1)
         else grafana_thinking_sa_created.json }}
    grafana_thinking_sa_was_created: "{{ grafana_thinking_sa_matches | length == 0 }}"
  no_log: true

- name: Require the thinking-poller account to belong to Grafana organization 1
  ansible.builtin.assert:
    that:
      - grafana_thinking_sa.orgId | int == 1
    fail_msg: "Tronbyt thinking service account is not in Grafana organization 1."

- name: Enforce the Viewer basic role for the thinking poller
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/serviceaccounts/{{ grafana_thinking_sa.id }}"
    method: PATCH
    headers: "{{ grafana_thinking_management_headers }}"
    body_format: json
    body:
      name: "{{ grafana_thinking_service_account_name }}"
      role: "{{ grafana_thinking_service_account_role }}"
    status_code: 200
  when: grafana_thinking_sa.role != grafana_thinking_service_account_role
  no_log: true
  delegate_to: localhost
  become: false

- name: Validate the currently vaulted thinking-poller token
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/user"
    method: GET
    headers:
      Authorization: "Bearer {{ grafana_thinking_api_token | default('') | trim }}"
    status_code: [200, 401, 403]
  register: grafana_thinking_token_check
  failed_when: false
  no_log: true
  delegate_to: localhost
  become: false

- name: Determine whether the vaulted token belongs to the Viewer identity
  ansible.builtin.set_fact:
    grafana_thinking_token_valid: >-
      {{ (grafana_thinking_token_check.status == 200)
         and ((grafana_thinking_token_check.json.login | default('')) == (grafana_thinking_sa.login | default('')))
         and ((grafana_thinking_token_check.json.orgId | default(0) | int) == 1) }}
  no_log: true

- name: List thinking-poller tokens with the management credential
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/serviceaccounts/{{ grafana_thinking_sa.id }}/tokens"
    method: GET
    headers: "{{ grafana_thinking_management_headers }}"
    status_code: 200
  register: grafana_thinking_existing_tokens_response
  no_log: true
  delegate_to: localhost
  become: false

- name: Classify existing thinking-poller tokens
  ansible.builtin.set_fact:
    grafana_thinking_existing_tokens: "{{ grafana_thinking_existing_tokens_response.json | default([]) }}"
    grafana_thinking_active_tokens: >-
      {{ grafana_thinking_existing_tokens_response.json | default([])
         | rejectattr('hasExpired', 'equalto', true) | list }}
    grafana_thinking_need_token: >-
      {{ (grafana_rotate_thinking_token | bool) or (not grafana_thinking_token_valid) }}
  no_log: true

- name: Prevent accidental duplicate thinking-poller token minting
  ansible.builtin.assert:
    that:
      - >-
        grafana_thinking_token_valid
        or (grafana_rotate_thinking_token | bool)
        or (grafana_thinking_sa_was_created | bool)
        or (grafana_thinking_active_tokens | length == 0)
    fail_msg: >-
      The vaulted Tronbyt thinking token is invalid, but Grafana already has an
      active token for this account. Token secrets are unrecoverable; refusing
      to mint a duplicate. Set grafana_rotate_thinking_token=true only for an
      intentional rotation.
  when: grafana_thinking_need_token

- name: Mint and persist the dedicated thinking-poller Viewer token
  when: grafana_thinking_need_token
  block:
    - name: Generate a unique thinking-poller token name
      ansible.builtin.set_fact:
        grafana_thinking_new_token_name: >-
          {{ grafana_thinking_service_account_token_name }} {{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}
      no_log: true

    - name: Mint the thinking-poller token using management auth
      ansible.builtin.uri:
        url: "{{ grafana_thinking_grafana_base }}/api/serviceaccounts/{{ grafana_thinking_sa.id }}/tokens"
        method: POST
        headers: "{{ grafana_thinking_management_headers }}"
        body_format: json
        body:
          name: "{{ grafana_thinking_new_token_name }}"
        status_code: [200, 201]
      register: grafana_thinking_new_token_response
      changed_when: grafana_thinking_new_token_response.status in [200, 201]
      no_log: true
      delegate_to: localhost
      become: false

    - name: Capture the one-time thinking-poller token secret
      ansible.builtin.set_fact:
        grafana_thinking_effective_token: "{{ grafana_thinking_new_token_response.json.key }}"
      no_log: true

    # stdin_add_newline: false is mandatory -- the secret is consumed verbatim
    # as an HTTP bearer value and a trailing newline breaks authentication.
    - name: Encrypt the thinking-poller token from standard input
      ansible.builtin.command:
        cmd: >-
          ansible-vault encrypt_string
          --vault-password-file {{ grafana_vault_password_file }}
          --stdin-name grafana_thinking_api_token
        stdin: "{{ grafana_thinking_effective_token }}"
        stdin_add_newline: false
      register: grafana_thinking_encrypted_token
      changed_when: true
      no_log: true
      delegate_to: localhost
      become: false

    - name: Persist the encrypted thinking-poller token in group vars
      ansible.builtin.replace:
        path: "{{ grafana_vault_vars_file }}"
        # Matches either the empty-string placeholder written by hand or a
        # previously persisted !vault block. A regexp that only matched the
        # !vault form silently failed to write, which left a minted token with
        # nowhere to live (Grafana returns the secret only once).
        regexp: '(?m)^grafana_thinking_api_token:(?: !vault \|\n(?:[ ]+.*\n)+?(?=\n|\Z)| "")'
        replace: "{{ grafana_thinking_encrypted_token.stdout }}\n"
      register: grafana_thinking_token_persisted
      no_log: true
      delegate_to: localhost
      become: false

    - name: Require successful encrypted token persistence
      ansible.builtin.assert:
        that:
          - grafana_thinking_token_persisted.changed
        fail_msg: >-
          The new Tronbyt thinking token was minted but could not be persisted
          in the encrypted group variable; manual recovery is required before
          retrying.
      no_log: true

    - name: Remove superseded thinking-poller tokens
      ansible.builtin.uri:
        url: >-
          {{ grafana_thinking_grafana_base }}/api/serviceaccounts/{{ grafana_thinking_sa.id }}/tokens/{{ item.id }}
        method: DELETE
        headers: "{{ grafana_thinking_management_headers }}"
        status_code: 200
      loop: "{{ grafana_thinking_existing_tokens }}"
      loop_control:
        label: "redacted token id"
      no_log: true
      delegate_to: localhost
      become: false

- name: Use the existing vaulted thinking-poller token when no token was minted
  ansible.builtin.set_fact:
    grafana_thinking_effective_token: "{{ grafana_thinking_api_token | default('') | trim }}"
  when: not grafana_thinking_need_token
  no_log: true

- name: Re-read the thinking-poller account with management auth
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/serviceaccounts/{{ grafana_thinking_sa.id }}"
    method: GET
    headers: "{{ grafana_thinking_management_headers }}"
    status_code: 200
  register: grafana_thinking_account_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Validate thinking-poller token authentication and identity
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/user"
    method: GET
    headers:
      Authorization: "Bearer {{ grafana_thinking_effective_token }}"
    status_code: 200
  register: grafana_thinking_auth_validation
  no_log: true
  delegate_to: localhost
  become: false

# The poller's actual query path. Verified working for Viewer tokens on this
# Grafana build; the /api/prometheus/{uid}/... namespace 404s here, and
# /api/ds/query (checked next) is the fallback the poller also implements.
- name: Validate thinking-poller Prometheus query permission
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/datasources/proxy/uid/{{ grafana_prometheus_uid }}/api/v1/query?query=vector(1)"
    method: GET
    headers:
      Authorization: "Bearer {{ grafana_thinking_effective_token }}"
    status_code: 200
  register: grafana_thinking_query_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Validate thinking-poller datasource query permission
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/ds/query"
    method: POST
    headers:
      Authorization: "Bearer {{ grafana_thinking_effective_token }}"
    body_format: json
    status_code: 200
    body:
      from: "now-5m"
      to: "now"
      queries:
        - refId: "A"
          datasource:
            uid: "{{ grafana_prometheus_uid }}"
          expr: "vector(1)"
          format: "time_series"
          instant: true
          range: false
  register: grafana_thinking_datasource_query_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Verify the thinking poller cannot mutate datasources
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/datasources/uid/__thinking_permission_probe__"
    method: PUT
    headers:
      Authorization: "Bearer {{ grafana_thinking_effective_token }}"
    body_format: json
    body:
      name: "permission-probe"
      type: "prometheus"
      url: "http://127.0.0.1"
      access: "proxy"
    status_code: 403
  register: grafana_thinking_mutation_denied_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Verify the thinking poller cannot use organization admin APIs
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/org/users"
    method: GET
    headers:
      Authorization: "Bearer {{ grafana_thinking_effective_token }}"
    status_code: 403
  register: grafana_thinking_admin_denied_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Verify the thinking poller cannot manage service accounts
  ansible.builtin.uri:
    url: "{{ grafana_thinking_grafana_base }}/api/serviceaccounts/search?perpage=1&page=1"
    method: GET
    headers:
      Authorization: "Bearer {{ grafana_thinking_effective_token }}"
    status_code: 403
  register: grafana_thinking_sa_mgmt_denied_validation
  no_log: true
  delegate_to: localhost
  become: false

- name: Build redacted thinking-poller permission validation summary
  ansible.builtin.set_fact:
    grafana_thinking_validation_summary:
      account_exists_org_1: >-
        {{ (grafana_thinking_account_validation.status == 200)
           and ((grafana_thinking_account_validation.json.orgId | int) == 1) }}
      account_role_viewer: >-
        {{ (grafana_thinking_account_validation.json.role | default('')) == 'Viewer' }}
      token_authenticates: "{{ grafana_thinking_auth_validation.status == 200 }}"
      token_identity_matches: >-
        {{ (grafana_thinking_auth_validation.json.login | default(''))
           == (grafana_thinking_account_validation.json.login | default('')) }}
      # Proves query EXECUTION, not endpoint access: Grafana can return HTTP
      # 200 with a query error encoded in the body (results.A.error on
      # /api/ds/query, status!=success on the proxy route). vector(1) must come
      # back as scalar 1 on both routes.
      prometheus_query_allowed: >-
        {{ (grafana_thinking_query_validation.status == 200)
           and (grafana_thinking_query_validation.json.status | default('') == 'success')
           and (grafana_thinking_query_validation.json.data.result | default([]) | length > 0)
           and ((grafana_thinking_query_validation.json.data.result[0].value[1]
                 | default('-1') | float) == 1.0) }}
      datasource_query_allowed: >-
        {{ (grafana_thinking_datasource_query_validation.status == 200)
           and ('error' not in (grafana_thinking_datasource_query_validation.json.results.A
                                | default({})))
           and (grafana_thinking_datasource_query_validation.json.results.A.data.frames
                | default([]) | length > 0)
           and ((grafana_thinking_datasource_query_validation.json.results.A.data.frames[0]
                 .data.values[1] | default([]) | last | default('-1') | float) == 1.0) }}
      datasource_mutation_denied: "{{ grafana_thinking_mutation_denied_validation.status == 403 }}"
      organization_admin_denied: "{{ grafana_thinking_admin_denied_validation.status == 403 }}"
      service_account_management_denied: >-
        {{ grafana_thinking_sa_mgmt_denied_validation.status == 403 }}
  no_log: true

- name: Report redacted thinking-poller permission validation
  ansible.builtin.debug:
    var: grafana_thinking_validation_summary

- name: Require all thinking-poller least-privilege checks to pass
  ansible.builtin.assert:
    that:
      - grafana_thinking_validation_summary.values() | select('equalto', false) | list | length == 0
    success_msg: "All redacted Tronbyt thinking Viewer permission checks passed."
    fail_msg: "One or more redacted Tronbyt thinking Viewer permission checks failed."
